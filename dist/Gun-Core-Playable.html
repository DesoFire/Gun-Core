// ===== modules/faction.js =====
function calculateDailyUpkeep() {
  return calculateDailyExpenseBreakdown().total;
}

function calculateBaseUpkeep() {
  return calculateDailyExpenseBreakdown().facilities.total + calculateDailyExpenseBreakdown().base.total;
}

function calculateDailyExpenseBreakdown(state = getState()) {
  return calculateDailyExpenseBreakdownFromDraft(state);
}

function calculateDailySupplyConsumption(state = getState()) {
  return (state.roster ?? [])
    .filter((character) => character.status !== "阵亡")
    .reduce((sum, character) => sum + calculateLivingSupplyCost(character), 0);
}

function isSecrecyBillingDay(day = getState().day) {
  const config = economyConfig.secrecy;
  return day >= config.firstBillingDay && (day - config.firstBillingDay) % config.billingCycleDays === 0;
}

function calculateSecrecyExpenseItems(state = getState()) {
  const config = economyConfig.secrecy;
  const items = [];
  if ((state.reputation ?? 0) > 0) {
    items.push({
      id: "base",
      type: "base",
      name: "基地黑历史",
      reputation: state.reputation ?? 0,
      cost: (state.reputation ?? 0) * config.baseMonthlyCostPerReputation,
      paid: false,
    });
  }
  state.roster
    .filter((character) => character.status !== "阵亡" && (character.personalReputation ?? 0) > 0)
    .forEach((character) => {
      items.push({
        id: character.id,
        type: "mercenary",
        name: character.name,
        reputation: character.personalReputation ?? 0,
        cost: (character.personalReputation ?? 0) * config.mercenaryMonthlyCostPerReputation,
        paid: false,
      });
    });
  return items;
}

function calculateUnpaidSecrecyReputation(state = getState()) {
  const mercenaryDebt = Object.values(state.unpaidSecrecy?.mercenaries ?? {}).reduce((sum, value) => sum + Math.max(0, value ?? 0), 0);
  return Math.max(0, state.unpaidSecrecy?.base ?? 0) + mercenaryDebt;
}

function approveSecrecyExpenses(paidIds = []) {
  const paid = new Set(paidIds);
  updateState((draft) => {
    if (draft.gameStatus !== "active" || !isSecrecyBillingDay(draft.day)) return;
    draft.unpaidSecrecy ??= { base: 0, mercenaries: {} };
    draft.unpaidSecrecy.mercenaries ??= {};
    const items = calculateSecrecyExpenseItems(draft);
    let paidCost = 0;
    let unpaidReputation = 0;

    items.forEach((item) => {
      const wantsPay = paid.has(item.id);
      if (wantsPay && draft.gold >= item.cost) {
        draft.gold -= item.cost;
        paidCost += item.cost;
        return;
      }

      unpaidReputation += item.reputation;
      if (item.type === "base") {
        draft.unpaidSecrecy.base = (draft.unpaidSecrecy.base ?? 0) + item.reputation;
      } else {
        draft.unpaidSecrecy.mercenaries[item.id] = (draft.unpaidSecrecy.mercenaries[item.id] ?? 0) + item.reputation;
      }
    });

    const stealthLoss = unpaidReputation * economyConfig.secrecy.stealthLossPerUnpaidReputation;
    draft.stealth = clamp(draft.stealth - stealthLoss, 0, 100);
    draft.lastSecrecyBillingDay = draft.day;
    draft.log.push(`第 ${draft.day} 天：隐秘费用结算，支付 ${paidCost} 金，未遮掩声望 ${unpaidReputation}，隐秘值下降 ${stealthLoss}。`);
  });
}

function calculateDailyExpenseBreakdownFromDraft(draft) {
  const livingRoster = draft.roster.filter((character) => character.status !== "阵亡");
  const wageItems = livingRoster
    .filter((character) => character.status === "待命")
    .map((character) => ({
      id: character.id,
      name: character.name,
      rank: calculateRank(character),
      status: character.status,
      cost: identityFee(character),
    }));
  const supplyItems = livingRoster.map((character) => ({
    id: character.id,
    name: character.name,
    rank: calculateRank(character),
    status: character.status,
    cost: calculateLivingSupplyCost(character),
  }));
  const equipmentItems = livingRoster.flatMap((character) =>
    Object.entries(character.equipment ?? {})
      .filter(([, item]) => item && (item.itemCategory === "weapon" || item.itemCategory === "armor" || item.slot === "weapon" || item.slot === "armor"))
      .map(([slot, item]) => ({
        id: item.id,
        characterId: character.id,
        characterName: character.name,
        slot,
        slotLabel: slot === "weapon" ? "武器" : "防具",
        itemName: item.name,
        rarity: item.rarity ?? "F",
        type: item.damageType ?? item.protectionType ?? item.type ?? "未知",
        cost: calculateEquipmentMaintenanceCost(item),
      }))
  );
  const facilityItems = Object.entries(draft.buildings)
    .filter(([, level]) => level > 0)
    .map(([id, level]) => ({
      id,
      name: buildings[id]?.name ?? id,
      level,
      rank: id === "defenses" ? `${level}座` : getFacilityRankLabel(level),
      cost: calculateFacilityUpkeep(id, level),
    }));
  const baseCost = economyConfig.dailyExpenses.baseUpkeep;
  const base = { total: baseCost, items: [{ id: "base", name: "基地基础开销", cost: baseCost }] };
  const wages = { total: sumCosts(wageItems), items: wageItems };
  const supplies = { total: sumCosts(supplyItems), items: supplyItems };
  const equipment = { total: sumCosts(equipmentItems), items: equipmentItems };
  const facilities = { total: sumCosts(facilityItems), items: facilityItems };
  return {
    total: base.total + wages.total + equipment.total + facilities.total,
    base,
    wages,
    supplies,
    equipment,
    facilities,
  };
}

function identityFee(character) {
  const rankIndex = Math.max(0, mercenaryRanks.indexOf(character.rank));
  const config = economyConfig.dailyExpenses.wages;
  const rankWage = config.rankDailyWage?.[rankIndex] ?? config.base + rankIndex * config.perRank;
  return rankWage + (character.personalReputation ?? 0) * (config.perPersonalReputation ?? 0) + (character.isPlayer ? config.playerBonus : 0);
}

function upgradeBuilding(id) {
  updateState((draft) => {
    const building = buildings[id];
    if (!building) return;
    const level = draft.buildings[id] ?? 0;
    if (id !== "defenses" && level >= facilityRanks.length) {
      draft.log.push(`第 ${draft.day} 天：${building.name} 已达到最高 S 级。`);
      return;
    }
    const nextLevel = level + 1;
    const cost = getFacilityUpgradeCost(id, level);
    if (draft.gold < cost) return;
    draft.gold -= cost;
    draft.buildings[id] = nextLevel;
    draft.timeline.push({
      id: createId(),
      day: draft.day,
      type: "facility",
      title: id === "defenses" ? `${building.name} x${nextLevel}` : `${building.name} ${getFacilityRankLabel(nextLevel)}`,
      status: "done",
      detail: "基地建设完成。",
    });
    draft.log.push(id === "defenses" ? `第 ${draft.day} 天：修建了第 ${nextLevel} 座${building.name}。` : `第 ${draft.day} 天：${building.name} 升到了 ${getFacilityRankLabel(nextLevel)}。`);
  });
}

function buyBlackMarketItem(kind) {
  updateState((draft) => {
    if (draft.gameStatus !== "active" || (draft.buildings.blackMarket ?? 0) <= 0) return;
    const rank = getFacilityRankLabel(draft.buildings.blackMarket ?? 0);
    const cost = getBlackMarketItemCost(kind, rank);
    if (draft.gold < cost) return;
    const item = createBlackMarketItem(kind, rank);
    draft.gold -= cost;
    if (kind === "mecha") {
      draft.mechs.unshift(item);
    } else {
      draft.inventory.unshift(item);
    }
    draft.timeline.push({
      id: createId(),
      day: draft.day,
      type: "facility",
      title: "黑市采购",
      status: "done",
      detail: `购入 ${item.name}。`,
    });
    draft.log.push(`第 ${draft.day} 天：支付 ${cost} 金，从 ${rank} 级黑市购入 ${item.name}。`);
  });
}

function buyBlackMarketWeapon() {
  buyBlackMarketItem("weapon");
}

function hospitalTreatMercenaries() {
  updateState((draft) => {
    if (draft.gameStatus !== "active" || (draft.buildings.hospital ?? 0) <= 0) return;
    const plan = createHospitalTreatmentPlan(draft);
    if (plan.entries.length === 0) {
      draft.log.push(`第 ${draft.day} 天：医疗中心没有找到需要处理的伤病佣兵。`);
      return;
    }
    if (draft.gold < plan.cost) return;
    draft.gold -= plan.cost;
    let cured = 0;
    plan.entries.forEach(({ character, condition }) => {
      if (randomNumber(1, 100) > plan.successChance) return;
      character.conditions = (character.conditions ?? []).filter((entry) => entry.id !== condition.id);
      character.wound = Math.max(0, (character.wound ?? 0) - economyConfig.facilities.hospitalWoundRecoveryOnSuccess);
      character.stress = Math.max(0, (character.stress ?? 0) - economyConfig.facilities.hospitalStressRecoveryOnSuccess);
      character.hp = Math.min(character.maxHp, (character.hp ?? character.maxHp) + 12);
      cured += 1;
    });
    draft.timeline.push({
      id: createId(),
      day: draft.day,
      type: "facility",
      title: "医疗中心治疗",
      status: "done",
      detail: `尝试处理 ${plan.entries.length} 个负面状态，成功 ${cured} 个。`,
    });
    draft.log.push(`第 ${draft.day} 天：支付 ${plan.cost} 金，医疗中心尝试治疗 ${plan.entries.length} 个负面状态，成功 ${cured} 个。`);
  });
}

function calculateHospitalTreatmentPlan(state = getState()) {
  return createHospitalTreatmentPlan(state);
}

function buySupplies(quantity = 1) {
  const amount = Math.max(0, Math.floor(Number(quantity) || 0));
  if (amount <= 0) return false;
  const cost = getSupplyPurchaseCost(amount);
  let purchased = false;
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    if (draft.gold < cost) return;
    draft.gold -= cost;
    draft.supplies = (draft.supplies ?? 0) + amount;
    draft.log.push(`第 ${draft.day} 天：购买 ${amount} 份补给，支付 ${cost} 金。`);
    purchased = true;
  });
  return purchased;
}

function getSupplyPurchaseCost(quantity = 1) {
  const amount = Math.max(0, Math.floor(Number(quantity) || 0));
  const tiers = economyConfig.dailyExpenses.livingSupplies.purchaseTiers ?? [{ quantity: 1, cost: 1 }];
  const exact = tiers.find((tier) => tier.quantity === amount);
  if (exact) return exact.cost;
  const unit = tiers.find((tier) => tier.quantity === 1)?.cost ?? 1;
  return amount * unit;
}

function payDailyUpkeep(draft) {
  const breakdown = calculateDailyExpenseBreakdownFromDraft(draft);
  const cost = breakdown.total;
  if (cost <= 0) return;

  if (draft.gold >= cost) {
    draft.gold -= cost;
    draft.log.push(`第 ${draft.day} 天：支付基地每日支出 ${cost} 金。`);
    return;
  }

  const shortage = cost - draft.gold;
  draft.gold = 0;
  const shortageConfig = economyConfig.dailyExpenses.shortage;
  draft.roster.filter((character) => character.status !== "阵亡").forEach((character) => {
    character.stress += shortageConfig.stress;
  });
  draft.log.push(`第 ${draft.day} 天：维护费用缺口 ${shortage} 金，资金清零。隐秘值不受每日支出影响。`);
}

function calculateRank(character) {
  return mercenaryRanks.includes(character.rank) ? character.rank : "无";
}

function getFacilityRankLabel(level) {
  if (!level || level <= 0) return "未解锁";
  return facilityRanks[Math.min(level - 1, facilityRanks.length - 1)];
}

function getFacilityUpgradeCost(id, level) {
  const building = buildings[id];
  if (!building) return 0;
  return level <= 0 ? building.unlockCost ?? building.cost : building.cost + level * economyConfig.facilities.upgradePerCurrentLevel;
}

function canUpgradeFacility(id) {
  const state = getState();
  if (id === "defenses") return true;
  const nextLevel = (state.buildings[id] ?? 0) + 1;
  return nextLevel <= facilityRanks.length;
}

function getBlackMarketItemCost(kind, rank) {
  const rankIndex = Math.max(0, facilityRanks.indexOf(rank));
  const base = economyConfig.blackMarket.baseCost[kind] ?? economyConfig.blackMarket.baseCost.fallback;
  const perRank = economyConfig.blackMarket.perRank[kind] ?? economyConfig.blackMarket.perRank.fallback;
  return base + rankIndex * perRank;
}

function createHospitalTreatmentPlan(draft) {
  const level = draft.buildings?.hospital ?? 0;
  const allowedSeverity = getHospitalAllowedSeverity(level);
  const successChance = getHospitalSuccessChance(level);
  const entries = [];
  draft.roster
    .filter((character) => character.status !== "阵亡")
    .forEach((character) => {
      (character.conditions ?? [])
        .filter((condition) => canHospitalTreatSeverity(condition.severity, allowedSeverity))
        .forEach((condition) => entries.push({ character, condition }));
    });
  const cost = entries.reduce((sum, entry) => sum + getHospitalConditionCost(entry.condition), 0);
  return { entries, cost, successChance, allowedSeverity };
}

function getHospitalAllowedSeverity(level) {
  const index = Math.max(0, Math.min(level - 1, economyConfig.facilities.hospitalSeverityByLevel.length - 1));
  return economyConfig.facilities.hospitalSeverityByLevel[index] ?? "light";
}

function getHospitalSuccessChance(level) {
  const index = Math.max(0, Math.min(level - 1, economyConfig.facilities.hospitalSuccessChanceByLevel.length - 1));
  return economyConfig.facilities.hospitalSuccessChanceByLevel[index] ?? 65;
}

function canHospitalTreatSeverity(severity = "light", allowedSeverity = "light") {
  return severityWeight(severity) <= severityWeight(allowedSeverity);
}

function severityWeight(severity = "light") {
  if (severity === "heavy") return 3;
  if (severity === "medium") return 2;
  return 1;
}

function getHospitalConditionCost(condition) {
  const costs = economyConfig.facilities.hospitalConditionCost;
  return costs[condition.severity] ?? costs.light ?? 14;
}

function calculateFacilityUpkeep(id, level) {
  if (!level || level <= 0) return 0;
  const rawCost = (buildings[id]?.upkeep ?? 0) * level * economyConfig.facilities.upkeepMultiplier;
  return Math.max(1, Math.round(rawCost));
}

function calculateLivingSupplyCost(character) {
  const rankIndex = Math.max(0, mercenaryRanks.indexOf(calculateRank(character)));
  return economyConfig.dailyExpenses.livingSupplies.rankDailySupply?.[rankIndex] ?? 1;
}

function calculateEquipmentMaintenanceCost(item) {
  const rankIndex = Math.max(0, facilityRanks.indexOf(item.rarity ?? "F"));
  const config = economyConfig.dailyExpenses.equipmentMaintenance;
  const base = item.itemCategory === "weapon" || item.slot === "weapon" ? config.weaponBase : config.armorBase;
  return base + rankIndex * config.perRank;
}

function sumCosts(items) {
  return items.reduce((sum, item) => sum + (item.cost ?? 0), 0);
}

function createBlackMarketItem(kind, rank) {
  if (kind === "weapon") return generateWeaponItem({ rarity: rank });
  if (kind === "armor") return generateArmorItem({ rarity: rank });
  if (kind === "mecha") return createRankedMecha(rank);
  return createRankedSupply(rank);
}

function createRankedSupply(rank) {
  const item = randomItem(blackMarketSupplyPool);
  const quantityRange = rank === "F" ? economyConfig.blackMarket.supplyQuantityLowRank : economyConfig.blackMarket.supplyQuantityHighRank;
  const quantity = randomNumber(...quantityRange);
  return {
    id: createId(),
    ...item,
    name: `${rank}级 ${item.name}`,
    rarity: rank,
    quantity,
    itemCategory: "supply",
  };
}

function createRankedMecha(rank) {
  const frame = randomItem(mechaFrames);
  return {
    id: createId(),
    ...frame,
    name: `${rank}级 ${frame.name}`,
    rarity: rank,
    condition: 100,
    maintenance: 20 + Math.max(0, facilityRanks.indexOf(rank)) * 18,
  };
}



// ===== modules/wealth.js =====
function getWealthCollections() {
  const state = getState();
  return wealthCollections.map((room) => ({
    ...room,
    items: room.items.map((item) => ({ ...item, owned: Boolean(state.wealth?.owned?.[item.id]) })),
  }));
}

function getWealthProgress(state = getState()) {
  const total = wealthCollections.reduce((sum, room) => sum + room.items.length, 0);
  const owned = wealthCollections.reduce(
    (sum, room) => sum + room.items.filter((item) => state.wealth?.owned?.[item.id]).length,
    0
  );
  const spent = wealthCollections.reduce(
    (sum, room) => sum + room.items.filter((item) => state.wealth?.owned?.[item.id]).reduce((roomSum, item) => roomSum + item.cost, 0),
    0
  );
  return { owned, total, spent, complete: total > 0 && owned >= total };
}

function buyWealthItem(itemId) {
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    draft.wealth ??= { owned: {} };
    if (draft.wealth.owned?.[itemId]) return;

    const item = wealthCollections.flatMap((room) => room.items).find((entry) => entry.id === itemId);
    if (!item || draft.gold < item.cost) return;

    draft.gold -= item.cost;
    draft.wealth.owned[item.id] = { day: draft.day, cost: item.cost };
    draft.log.push(`第 ${draft.day} 天：私人收藏室新增「${item.name}」，花费 ${item.cost} 金。`);
    if (getWealthProgress(draft).complete) {
      draft.gameStatus = "won";
      draft.log.push(`第 ${draft.day} 天：收藏室全部填满。战争财完成私人化，游戏胜利。`);
    }
  });
}



// ===== modules/game.js =====
function getGameSummary() {
  const state = getState();
  return buildGameSummary(state);
}

function evaluateGameOverDraft(draft) {
  if (draft.gameStatus !== "active") return;

  const wealthProgress = getWealthProgress(draft);
  if (wealthProgress.complete) {
    draft.gameStatus = "won";
    draft.log.push(`第 ${draft.day} 天：收藏室全部填满。战争财完成私人化，游戏胜利。`);
    return;
  }

  if (draft.stealth <= 0) {
    draft.gameStatus = "lost";
    draft.log.push(`第 ${draft.day} 天：隐秘值归零。身份链路暴露，事务所被迫撤离，游戏失败。`);
    return;
  }
}

function buildGameSummary(state) {
  const wealthProgress = getWealthProgress(state);
  const activeContracts = state.missions.filter((mission) => mission.status === "active").length;
  const availableRoster = state.roster.filter((character) => character.status === "待命").length;
  return {
    status: state.gameStatus,
    reputationLeft: Math.max(0, wealthProgress.total - wealthProgress.owned),
    wealthProgress,
    activeContracts,
    availableRoster,
    objectiveText: `买完整个私人收藏室：${wealthProgress.owned}/${wealthProgress.total}`,
  };
}



// ===== modules/mission.js =====
function getMissions() {
  return getState().missions;
}

function createMission() {
  return createContract();
}

function createContract(options = {}) {
  const state = getState();
  const type = options.type ?? randomItem(contractTypes);
  const issuer = options.issuer ?? randomIssuer();
  const difficultyConfig = economyConfig.contracts.difficulty;
  const reputationTier = Math.floor((state.reputation ?? 0) / difficultyConfig.reputationTierStep);
  const difficulty = options.difficulty ?? clamp(randomNumber(difficultyConfig.baseMin, difficultyConfig.baseMax) + reputationTier, difficultyConfig.min, difficultyConfig.max);
  const duration = options.duration ?? randomNumber(1, 3 + Math.floor(difficulty / 2));
  const issueDay = options.issueDay ?? state.day ?? 1;
  const expiresDay = options.expiresDay ?? issueDay + randomNumber(2, 4) + Math.floor(difficulty / 2);
  const rewardConfig = economyConfig.contracts.reward;
  const rewardGold = Math.round(
    (rewardConfig.baseGold + difficulty * randomNumber(rewardConfig.goldPerDifficultyMin, rewardConfig.goldPerDifficultyMax)) *
      (options.rewardMultiplier ?? 1)
  );
  const rewardReputation = Math.max(
    rewardConfig.minReputation,
    Math.round(
      difficulty * rewardConfig.reputationPerDifficulty +
        randomNumber(rewardConfig.reputationRandomMin, rewardConfig.reputationRandomMax)
    )
  );
  const tags = [...new Set(type.tags)];
  const name = `${type.name}契约：${randomContractSubject(type)}`;
  const powerRequirement = options.powerRequirement ?? calculateContractPowerRequirement(difficulty, state.reputation ?? 0);
  const recommendedTeamSize = options.recommendedTeamSize ?? createRecommendedTeamSize(difficulty);
  const requirements = options.requirements ?? createContractRequirements(tags);

  return {
    id: createId(),
    name,
    issuer,
    type: type.name,
    typeCode: type.code,
    actionType: type.actionType,
    acquisition: options.acquisition ?? "广撒网",
    difficulty,
    powerRequirement,
    powerIntelLevel: options.powerIntelLevel ?? 0,
    recommendedTeamSize,
    requirements,
    duration,
    issueDay,
    expiresDay,
    reward: { gold: rewardGold, reputation: rewardReputation },
    description: `${randomItem(type.verbs)}目标。${randomItem(contractBriefFragments)}`,
    intel: createContractIntel(),
    revealedIntel: options.freeIntel ? [randomItem(contractIntelFields).key] : [],
    hidden: { twist: randomContractHiddenTwist() },
    tags,
    refreshCost: calculateRefreshCost(difficulty),
    investigateCost: calculateInvestigateCost({ rewardGold }),
    assigned: [],
    remaining: duration,
    status: "available",
  };
}

function normalizeMission(mission) {
  upgradeMissionToContract(mission);
  mission.remaining ??= mission.duration;
  mission.assigned ??= [];
  mission.status ??= "available";
  mission.tags ??= [];
  normalizeContractPlanningFields(mission);
  return mission;
}

function refreshMission(id) {
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const index = draft.missions.findIndex((item) => item.id === id);
    const mission = draft.missions[index];
    if (!mission || mission.status !== "available") return;

    const cost = mission.refreshCost ?? calculateRefreshCost(mission.difficulty ?? 2);
    if (draft.gold < cost) return;

    draft.gold -= cost;
    draft.missions[index] = createContract();
    draft.log.push(`第 ${draft.day} 天：支付 ${cost} 金刷新了一份契约。`);
  });
}

function investigateMission(id, intelKey = "random") {
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const mission = draft.missions.find((item) => item.id === id);
    if (!mission || mission.status !== "available") return;

    normalizeContractPowerFields(mission, draft.reputation ?? 0);
    normalizeContractPlanningFields(mission);
    upgradeMissionToContract(mission);
    mission.revealedIntel ??= [];
    const target = chooseInvestigationTarget(mission, intelKey);
    if (!target) return;

    const cost = calculateDiscountedInvestigateCost(draft, mission, target.mode);
    if (draft.gold < cost) return;

    draft.gold -= cost;
    let detail = target.label;
    if (target.key === "power") {
      mission.powerIntelLevel += 1;
    } else if (!mission.revealedIntel.includes(target.key)) {
      mission.revealedIntel.push(target.key);
    }
    mission.investigateCost ??= calculateInvestigateCost({ rewardGold: mission.reward?.gold, difficulty: mission.difficulty ?? 2 });
    draft.log.push(`第 ${draft.day} 天：支付 ${cost} 金调查「${mission.name}」，更新：${detail}。`);
  });
}

function startMission(id, memberIds) {
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const mission = draft.missions.find((item) => item.id === id);
    if (!mission || mission.status !== "available") return;
    const validMemberIds = [...new Set(memberIds)].filter((memberId) =>
      draft.roster.some((character) => character.id === memberId && character.status === "待命")
    );
    if (validMemberIds.length === 0) return;
    if (validMemberIds.length > 4) {
      draft.log.push(`第 ${draft.day} 天：一支派遣小队最多 4 人。`);
      return;
    }

    mission.status = "active";
    mission.assigned = [...validMemberIds];
    mission.remaining = mission.duration;
    mission.startDay = draft.day;
    mission.endDay = draft.day + mission.duration;
    mission.advancePaid = calculateMissionAdvancePayment(mission);
    draft.gold += mission.advancePaid;
    mission.deferredWages = Object.fromEntries(
      validMemberIds.map((memberId) => {
        const character = draft.roster.find((item) => item.id === memberId);
        return [memberId, character ? identityFee(character) : 0];
      })
    );
    mission.deferredWageDays = mission.duration;
    draft.roster.forEach((character) => {
      if (validMemberIds.includes(character.id)) character.status = `履行「${mission.name}」`;
    });
    draft.timeline.push({
      id: createId(),
      day: draft.day,
      endDay: mission.endDay,
      type: "contract",
      title: mission.name,
      status: "active",
      detail: `执行 ${mission.duration} 天。队伍：${validMemberIds.length} 人。`,
      missionId: mission.id,
    });
    refillAvailableMissionsDraft(draft);
    draft.log.push(`第 ${draft.day} 天：小队已出发履行契约「${mission.name}」。`);
  });
}

function advanceDay() {
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    draft.day += 1;
    resolveBaseRaidDraft(draft);
    payDailyUpkeep(draft);
    draft.supplies = Math.max(0, draft.supplies - calculateDailySupplyConsumption(draft));
    recoverRestingStressDraft(draft);

    if (draft.buildings.infirmary > 0) {
      draft.roster.filter((character) => character.status !== "阵亡").forEach((character) => {
        if (character.wound > 0 || character.stress > 0) {
          character.stress = Math.max(0, character.stress - draft.buildings.infirmary);
        }
      });
    }

    draft.missions
      .filter((mission) => mission.status === "active")
      .forEach((mission) => {
        mission.remaining -= 1;
        if (mission.remaining <= 0) resolveMissionDraft(draft, mission);
      });

    const expiredMissions = draft.missions.filter((mission) => mission.status === "available" && mission.expiresDay < draft.day);
    expiredMissions.forEach((mission) => {
      draft.timeline.push({
        id: createId(),
        day: draft.day,
        type: "contract",
        title: mission.name,
        status: "missed",
        detail: "契约截止，发布方撤回委托。",
        missionId: mission.id,
      });
      draft.log.push(`第 ${draft.day} 天：契约「${mission.name}」超过截止日，已从列表撤下。`);
    });
    draft.missions = draft.missions.filter((mission) => mission.status !== "available" || mission.expiresDay >= draft.day);

    refillAvailableMissionsDraft(draft);

    if (draft.supplies === 0) {
      draft.roster.filter((character) => character.status !== "阵亡").forEach((character) => {
        character.stress += economyConfig.contracts.execution.noSupplyStress;
      });
      draft.log.push(`第 ${draft.day} 天：补给耗尽，所有佣兵压力上升。`);
    }

    draft.roster.forEach((character) => resolveStressBreakDraft(draft, character));

    evaluateGameOverDraft(draft);
  });
}

function calculateMissionChance(memberIds, mission) {
  const state = getState();
  return calculateMissionChanceFromRoster(state.roster, state.buildings, memberIds, mission);
}

function getMissionRisk(memberIds, mission) {
  return getRiskLabel(calculateMissionChance(memberIds, mission));
}

function getContractRiskTag(mission) {
  const config = economyConfig.contracts.display;
  const roughChance = clamp(
    config.roughRiskBase -
      (mission.difficulty ?? 2) * config.roughRiskDifficultyPenalty -
      (mission.duration ?? 1) * config.roughRiskDurationPenalty,
    config.roughRiskMin,
    config.roughRiskMax
  );
  return getRiskLabel(roughChance);
}

function evaluateMissionFit(memberIds, mission) {
  const state = getState();
  return evaluateMissionFitFromRoster(state.roster, state.buildings, memberIds, mission);
}

function getMissionPowerRange(mission) {
  normalizeContractPowerFields(mission, getState().reputation ?? 0);
  const level = mission.powerIntelLevel ?? 0;
  const spread = economyConfig.contracts.display.powerIntelSpreads[Math.min(level, 3)];
  const low = Math.max(1, mission.powerRequirement - spread);
  const high = mission.powerRequirement + spread;
  return { low, high, level };
}

function getTeamCombatPower(memberIds) {
  const state = getState();
  return calculateTeamCombatPower(state.roster, memberIds);
}

function resolveMissionDraft(draft, mission) {
  normalizeContractPowerFields(mission, draft.reputation ?? 0);
  normalizeContractPlanningFields(mission);
  const fit = evaluateMissionFitFromRoster(draft.roster, draft.buildings, mission.assigned, mission);
  const teamPower = fit.teamPower;
  const gap = teamPower - mission.powerRequirement;
  const chance = fit.chance;
  const success = randomNumber(1, 100) <= chance;
  const team = draft.roster.filter((character) => mission.assigned.includes(character.id));
  const outcome = applyHiddenTwistDraft(draft, mission, team, success);
  const enemyDamageTypes = mission.requirements?.damageTypes ?? [];

  team.forEach((character) => {
    character.contractRecord.survived += 1;
    if (success) character.contractRecord.completed += 1;
    if (!success) character.contractRecord.failed += 1;
    character.stress += calculateMissionStressGain(character, success);
    const deathRisk = calculateDeathRisk(gap, mission.difficulty, character, team, success);
    const woundRisk = calculateWoundRisk(gap, mission.difficulty, success, team);
    if (randomNumber(1, 100) <= deathRisk) {
      character.status = "阵亡";
      character.hp = 0;
      character.wound += 3;
      draft.log.push(`第 ${draft.day} 天：${character.name} 在「${mission.name}」中阵亡。`);
      return;
    }
    character.status = "待命";
    if (randomNumber(1, 100) <= woundRisk) {
      character.wound += 1;
      character.hp = Math.max(1, character.hp - randomNumber(4, 10));
      applyNegativeConditionDraft(draft, character, {
        severity: chooseConditionSeverity(gap, mission.difficulty, success),
        damageType: randomItem(enemyDamageTypes),
        armorMatched: hasMatchingArmor(character, enemyDamageTypes),
      });
    }
    maybeApplyDamageTypeConditionDraft(draft, character, mission, gap, success);
    if (success) {
      resolveGrowthDraft(draft, character, mission.actionType ?? "logistics");
    } else {
      applyNegativeConditionDraft(draft, character, {
        severity: chooseConditionSeverity(gap, mission.difficulty, success),
        damageType: randomItem(enemyDamageTypes),
        armorMatched: hasMatchingArmor(character, enemyDamageTypes),
      });
    }
    resolveStressBreakDraft(draft, character);
  });

  if (success) {
    const grossGold = Math.max(0, Math.round((mission.reward.gold + outcome.goldDelta) * getRewardGoldMultiplier(team)));
    const gold = Math.max(0, grossGold - (mission.advancePaid ?? 0));
    const reputation = Math.max(0, mission.reward.reputation + outcome.reputationDelta);
    distributeContractReputationDraft(draft, team.filter((character) => character.status !== "阵亡"), reputation);
    draft.gold += gold;
    draft.log.push(`第 ${draft.day} 天：契约「${mission.name}」成功。队伍战斗力 ${teamPower} / 需求 ${mission.powerRequirement}，获得 ${gold} 金，队员瓜分 ${reputation} 声望。${outcome.text}`);
  } else {
    const reputationLoss = calculateMissionReputationLoss(mission, team.length);
    applyContractReputationLossDraft(draft, team.filter((character) => character.status !== "阵亡"), reputationLoss);
    if (outcome.reputationDelta > 0) distributeContractReputationDraft(draft, team.filter((character) => character.status !== "阵亡"), outcome.reputationDelta);
    draft.gold = Math.max(0, draft.gold + outcome.goldDelta);
    draft.log.push(`第 ${draft.day} 天：契约「${mission.name}」失败。队伍战斗力 ${teamPower} / 需求 ${mission.powerRequirement}，伤亡风险上升。${outcome.text}`);
  }

  settleReturningWagesDraft(draft, mission, team.filter((character) => character.status !== "阵亡"));

  const timelineEntry = draft.timeline.find((entry) => entry.missionId === mission.id && entry.status === "active");
  if (timelineEntry) {
    timelineEntry.status = success ? "done" : "failed";
    timelineEntry.day = mission.startDay ?? timelineEntry.day;
    timelineEntry.endDay = draft.day;
    timelineEntry.detail = success ? "契约完成并结算。" : "契约失败，队伍返回。";
  }
  draft.missions = draft.missions.filter((item) => item.id !== mission.id);
  evaluateGameOverDraft(draft);
}

function settleReturningWagesDraft(draft, mission, returningTeam) {
  if (returningTeam.length === 0) return;

  const serviceDays = Math.max(
    1,
    mission.deferredWageDays ?? ((draft.day ?? mission.endDay ?? 0) - (mission.startDay ?? draft.day ?? 0))
  );
  const totalWages = returningTeam.reduce((sum, character) => {
    const dailyWage = mission.deferredWages?.[character.id] ?? identityFee(character);
    return sum + dailyWage * serviceDays;
  }, 0);
  if (totalWages <= 0) return;

  if (draft.gold >= totalWages) {
    draft.gold -= totalWages;
    draft.log.push(`第 ${draft.day} 天：外勤队伍归来，结清 ${serviceDays} 天外勤薪资 ${totalWages} 金。`);
    return;
  }

  const shortage = totalWages - draft.gold;
  draft.gold = 0;
  const config = economyConfig.contracts.execution;
  returningTeam.forEach((character) => {
    character.stress += config.wageShortageStress;
  });
  draft.log.push(`第 ${draft.day} 天：外勤薪资需要 ${totalWages} 金，但资金缺口 ${shortage} 金。返队佣兵压力上升，隐秘值不受欠薪影响。`);
}

function resolveBaseRaidDraft(draft) {
  const unpaidReputation = calculateUnpaidSecrecyReputation(draft);
  const config = economyConfig.baseRaid;
  if (unpaidReputation < config.minUnpaidReputationForRaid) return;
  const raidChance = clamp(100 - (draft.stealth ?? 0), 0, 100);
  if (raidChance <= 0 || randomNumber(1, 100) > raidChance) return;

  const defenders = draft.roster.filter((character) => character.status === "待命");
  const difficulty = calculateRaidDifficulty(unpaidReputation);
  if (defenders.length === 0) {
    applyBaseRaidFailureDraft(draft, difficulty, "无人留守");
    return;
  }

  randomlyEquipDefendersDraft(draft, defenders);
  const powerRequirement = calculateContractPowerRequirement(difficulty, unpaidReputation);
  const mission = createContract({
    difficulty,
    powerRequirement,
    duration: 1,
    rewardMultiplier: 1,
    recommendedTeamSize: { min: 1, max: 4 },
    requirements: createContractRequirements(["守卫", "战斗"]),
  });
  mission.name = "基地暴露袭击";
  mission.powerRequirement = powerRequirement;
  mission.status = "raid";

  const memberIds = defenders.map((character) => character.id);
  const baseDefensePower = calculateBaseDefensePower(draft);
  const fit = evaluateMissionFitFromRoster(draft.roster, draft.buildings, memberIds, mission, { extraPower: baseDefensePower });
  const success = randomNumber(1, 100) <= fit.chance;
  const gap = fit.teamPower - powerRequirement;
  const enemyDamageTypes = mission.requirements?.damageTypes ?? [];

  defenders.forEach((character) => {
    character.stress += calculateMissionStressGain(character, success);
    const deathRisk = calculateDeathRisk(gap, difficulty, character, defenders, success);
    const woundRisk = calculateWoundRisk(gap, difficulty, success, defenders);
    if (randomNumber(1, 100) <= deathRisk) {
      character.status = "阵亡";
      character.hp = 0;
      character.wound += 3;
      return;
    }
    if (randomNumber(1, 100) <= woundRisk) {
      character.wound += 1;
      character.hp = Math.max(1, character.hp - randomNumber(4, 10));
      applyNegativeConditionDraft(draft, character, {
        severity: chooseConditionSeverity(gap, difficulty, success),
        damageType: randomItem(enemyDamageTypes),
        armorMatched: hasMatchingArmor(character, enemyDamageTypes),
      });
    }
    maybeApplyDamageTypeConditionDraft(draft, character, mission, gap, success);
    resolveStressBreakDraft(draft, character);
  });

  if (success) {
    draft.log.push(`第 ${draft.day} 天：基地遭遇袭击，留守佣兵与防御设施防守成功。防御设施提供 ${baseDefensePower} 战斗力。`);
    return;
  }

  applyBaseRaidFailureDraft(draft, difficulty, "防守失败");
}

function calculateRaidDifficulty(unpaidReputation) {
  const config = economyConfig.baseRaid;
  return clamp(Math.ceil(unpaidReputation / config.unpaidReputationPerDifficulty), config.minDifficulty, config.maxDifficulty);
}

function calculateBaseDefensePower(draft) {
  return (draft.buildings?.defenses ?? 0) * economyConfig.facilities.defensePowerPerLevel;
}

function randomlyEquipDefendersDraft(draft, defenders) {
  const pool = [...(draft.inventory ?? [])].sort(() => Math.random() - 0.5);
  defenders.forEach((character) => {
    ["weapon", "armor"].forEach((slot) => {
      const index = pool.findIndex((item) => item.slot === slot || item.itemCategory === slot);
      if (index < 0) return;
      const [item] = pool.splice(index, 1);
      if (character.equipment?.[slot]) pool.push(character.equipment[slot]);
      character.equipment[slot] = item;
    });
  });
  draft.inventory = pool;
}

function applyBaseRaidFailureDraft(draft, difficulty, reason) {
  const rewardConfig = economyConfig.contracts.reward;
  const raidConfig = economyConfig.baseRaid;
  const goldLoss = Math.min(
    draft.gold,
    rewardConfig.baseGold + difficulty * randomNumber(rewardConfig.goldPerDifficultyMin, rewardConfig.goldPerDifficultyMax)
  );
  const stealthLoss = randomNumber(raidConfig.failureStealthLossMin, raidConfig.failureStealthLossMax);
  draft.gold -= goldLoss;
  draft.stealth = clamp(draft.stealth - stealthLoss, 0, 100);
  maybeDowngradeFacilityDraft(draft);
  draft.log.push(`第 ${draft.day} 天：基地遭遇袭击，${reason}，损失 ${goldLoss} 金，隐秘值下降 ${stealthLoss}。`);
}

function maybeDowngradeFacilityDraft(draft) {
  if (randomNumber(1, 100) > economyConfig.baseRaid.facilityDamageChance) return;
  const candidates = Object.entries(draft.buildings ?? {}).filter(([, level]) => level > 0);
  if (candidates.length === 0) return;
  const [id, level] = randomItem(candidates);
  draft.buildings[id] = Math.max(0, level - economyConfig.baseRaid.facilityDowngradeAmount);
}

function calculateMissionChanceFromRoster(roster, buildings, memberIds, mission) {
  return evaluateMissionFitFromRoster(roster, buildings, memberIds, mission).chance;
}

function refillAvailableMissionsDraft(draft) {
  while (draft.missions.filter((mission) => mission.status === "available").length < economyConfig.contracts.missionBoard.availableLimit) {
    draft.missions.push(createContract({ issueDay: draft.day }));
  }
}

function evaluateMissionFitFromRoster(roster, buildings, memberIds, mission, options = {}) {
  if (memberIds.length === 0) {
    return {
      chance: 0,
      teamPower: 0,
      powerGap: -(mission.powerRequirement ?? 0),
      risk: getRiskLabel(0),
      teamSizePenalty: 0,
      matchingTags: 0,
      matchingWeapons: 0,
      matchingDamageTypes: 0,
      matchingCareerCategories: 0,
      careerCategoryPenalty: 0,
      unlockedIntelBonus: 0,
      intelBonus: 0,
    };
  }

  normalizeContractPowerFields(mission, getState().reputation ?? 0);
  normalizeContractPlanningFields(mission);
  const team = roster.filter((character) => memberIds.includes(character.id));
  const teamPower = calculateTeamCombatPower(roster, memberIds) + (options.extraPower ?? 0);
  const powerChance = calculateMissionChanceFromPower(teamPower - mission.powerRequirement);
  const sizePenalty = calculateTeamSizePenalty(memberIds.length, mission.recommendedTeamSize);
  const tagBonus = calculateTagFitBonus(team, mission);
  const equipmentBonus = calculateEquipmentFitBonus(team, mission);
  const careerFit = calculateCareerFit(team, mission);
  const careerEffectBonus = calculateCareerEffectBonus(team, mission);
  const unlockedIntelBonus = (mission.revealedIntel?.length ?? 0) * 2 + (mission.powerIntelLevel ?? 0);
  const intelBonus = 0;
  const chance = clamp(
    powerChance + tagBonus + equipmentBonus + careerFit.bonus + careerEffectBonus + unlockedIntelBonus + intelBonus - sizePenalty - careerFit.penalty,
    2,
    98
  );

  return {
    chance,
    teamPower,
    powerGap: teamPower - mission.powerRequirement,
    risk: getRiskLabel(chance),
    teamSizePenalty: sizePenalty,
    matchingTags: countMatchingTags(team, mission.tags ?? []),
    matchingWeapons: countMatchingEquipmentTags(team, mission.requirements?.weaponTypes ?? []),
    matchingDamageTypes: countMatchingEquipmentTags(team, mission.requirements?.damageTypes ?? []),
    matchingCareerCategories: careerFit.matched,
    careerCategoryPenalty: careerFit.penalty,
    unlockedIntelBonus,
    intelBonus,
  };
}

function getRiskLabel(chance) {
  if (chance >= 90) return { label: "十拿九稳", tone: "safe", description: "除非合同会读心，否则问题不大。" };
  if (chance >= 70) return { label: "有风险", tone: "warning", description: "能接，但别把遗言写得太潦草。" };
  if (chance >= 45) return { label: "高危", tone: "danger", description: "客户说简单，客户一般不进现场。" };
  return { label: "近乎送死", tone: "fatal", description: "这不是契约，是遗产分配预演。" };
}

function calculateTeamSizePenalty(teamSize, recommendedTeamSize) {
  const min = recommendedTeamSize?.min ?? 1;
  const max = recommendedTeamSize?.max ?? 4;
  if (teamSize < min) return (min - teamSize) * 12;
  if (teamSize > max) return (teamSize - max) * 8;
  return 0;
}

function calculateTagFitBonus(team, mission) {
  return Math.min(18, countMatchingTags(team, mission.tags ?? []) * 4);
}

function calculateEquipmentFitBonus(team, mission) {
  const weaponMatches = countMatchingEquipmentTags(team, mission.requirements?.weaponTypes ?? []);
  const damageMatches = countMatchingEquipmentTags(team, mission.requirements?.damageTypes ?? []);
  return Math.min(20, weaponMatches * 5 + damageMatches * 4);
}

function calculateCareerFit(team, mission) {
  const required = mission.requirements?.careerCategories ?? [];
  if (required.length === 0) return { matched: 0, penalty: 0, bonus: 0 };
  const owned = new Set(team.map((character) => getCareerCategory(character)).filter(Boolean));
  const matched = required.filter((category) => owned.has(category)).length;
  const missing = required.length - matched;
  const penalty = missing <= 0 ? 0 : missing * 10 + (matched === 0 ? 6 : 0);
  const bonus = missing === 0 ? 4 : 0;
  return { matched, penalty, bonus };
}

function calculateCareerEffectBonus(team, mission) {
  return team.reduce((sum, character) => {
    const category = getCareerCategoryConfig(character);
    const career = getCareerConfig(character);
    let bonus = 0;
    if (mission.actionType === "combat") bonus += category?.effects?.combatMissionChanceBonus ?? 0;
    if (mission.actionType === "logistics") bonus += category?.effects?.logisticsMissionChanceBonus ?? 0;
    if ((mission.requirements?.damageTypes ?? []).includes("异源")) {
      bonus += category?.effects?.abnormalMissionChanceBonus ?? 0;
      bonus += career?.effects?.abnormalMissionChanceBonus ?? 0;
    }
    const tagBonus = career?.effects?.tagMissionChanceBonus;
    if (tagBonus && (mission.tags ?? []).includes(tagBonus.tag)) bonus += tagBonus.value ?? 0;
    if (career?.effects?.belowMaxTeamChanceBonus && team.length < (mission.recommendedTeamSize?.max ?? 4)) {
      bonus += career.effects.belowMaxTeamChanceBonus;
    }
    if (career?.effects?.requirementMatchChanceBonus && hasAnyRequirementMatch(character, mission)) {
      bonus += career.effects.requirementMatchChanceBonus;
    }
    return sum + bonus;
  }, 0);
}

function countMatchingTags(team, tags) {
  return team.reduce((sum, character) => sum + (character.tags ?? []).filter((tag) => tags.includes(tag)).length, 0);
}

function countMatchingEquipmentTags(team, wantedTags) {
  if (wantedTags.length === 0) return 0;
  return team.reduce((sum, character) => {
    const equipmentTags = Object.values(character.equipment ?? {})
      .filter(Boolean)
      .flatMap((item) => [item.type, item.damageType, item.itemCategory, ...(item.tags ?? [])].filter(Boolean));
    return sum + equipmentTags.filter((tag) => wantedTags.includes(tag)).length;
  }, 0);
}

function hasAnyRequirementMatch(character, mission) {
  const equipmentTags = Object.values(character.equipment ?? {})
    .filter(Boolean)
    .flatMap((item) => [item.type, item.damageType, item.itemCategory, ...(item.tags ?? [])].filter(Boolean));
  const wanted = [...(mission.requirements?.weaponTypes ?? []), ...(mission.requirements?.damageTypes ?? []), ...(mission.requirements?.tags ?? [])];
  return wanted.some((tag) => equipmentTags.includes(tag) || (character.tags ?? []).includes(tag));
}

function getCareerConfig(character) {
  return characterClasses[character.classId];
}

function getCareerCategory(character) {
  return character.careerCategory ?? getCareerConfig(character)?.category;
}

function getCareerCategoryConfig(character) {
  return careerCategories[getCareerCategory(character)];
}

function randomIssuer() {
  if (randomNumber(1, 100) <= 35) return randomItem(contractIssuers);
  return randomItem(otherContractIssuers);
}

function randomContractSubject(type) {
  const subjects = {
    护送: ["补给车队", "边境医师", "失联证人", "净水芯片"],
    运输: ["封存货箱", "机兵零件", "加密药剂", "旧联邦账册"],
    侦察: ["坠落带", "敌方前哨", "异常信号", "空港残骸"],
    搜索: ["失踪信使", "地下档案", "污染源头", "遗迹入口"],
    回收: ["黑匣子", "样本罐", "无人机残骸", "债务芯片"],
    歼灭: ["异源兽巢", "劫掠队", "叛逃安保组", "失控机兵"],
    突袭: ["走私仓库", "临时据点", "火控节点", "黑市拍卖场"],
    破坏: ["中继塔", "采矿钻机", "追踪网络", "军火流水线"],
    营救: ["被困工程师", "欠债线人", "伤员小队", "劫持目标"],
    防御: ["边境诊所", "补给站", "临时营地", "净水设施"],
    占领: ["转运站", "通讯楼", "矿区闸门", "列车站台"],
    特殊: ["无名委托", "未知信号", "旧神经接口", "异常遗物"],
  };
  return randomItem(subjects[type.name] ?? ["未分类目标"]);
}

function createContractIntel() {
  return Object.fromEntries(contractIntelFields.map((field) => [field.key, randomItem(contractIntelPool[field.key])]));
}

function createRecommendedTeamSize(difficulty) {
  if (difficulty <= 1) return { min: 1, max: 2 };
  if (difficulty <= 3) return { min: 2, max: 3 };
  return { min: 3, max: 4 };
}

function createContractRequirements(tags = []) {
  const weaponTypeCount = randomNumber(1, 2);
  const damageTypeCount = randomNumber(1, 2);
  const careerCategoryCount = randomNumber(1, 100) <= 35 ? 2 : 1;
  return {
    weaponTypes: drawUniqueRequirements(contractRequirementPool.weaponTypes, weaponTypeCount),
    damageTypes: drawUniqueRequirements(contractRequirementPool.damageTypes, damageTypeCount),
    careerCategories: drawUniqueRequirements(contractRequirementPool.careerCategories, careerCategoryCount),
    tags: tags.slice(0, 2),
  };
}

function drawUniqueRequirements(pool, count) {
  const result = [];
  while (result.length < count && result.length < pool.length) {
    const item = randomItem(pool);
    if (!result.includes(item)) result.push(item);
  }
  return result;
}

function calculateContractPowerRequirement(difficulty, reputation) {
  const config = economyConfig.contracts.requirement;
  const reputationPressure = Math.floor(reputation / config.reputationStep) * config.reputationPressure;
  return (
    config.basePower +
    difficulty * randomNumber(config.powerPerDifficultyMin, config.powerPerDifficultyMax) +
    reputationPressure +
    randomNumber(config.randomOffsetMin, config.randomOffsetMax)
  );
}

function normalizeContractPowerFields(mission, reputation = 0) {
  mission.powerRequirement ??= calculateContractPowerRequirement(mission.difficulty ?? 2, reputation);
  mission.powerIntelLevel ??= Math.min(3, mission.revealedIntel?.length ?? 0);
}

function normalizeContractPlanningFields(mission) {
  mission.recommendedTeamSize ??= createRecommendedTeamSize(mission.difficulty ?? 2);
  mission.requirements ??= createContractRequirements(mission.tags ?? []);
  mission.requirements.weaponTypes ??= [];
  mission.requirements.damageTypes ??= [];
  mission.requirements.careerCategories ??= [];
  mission.requirements.tags ??= mission.tags?.slice(0, 2) ?? [];
}

function calculateMissionChanceFromPower(gap) {
  return clamp(Math.round(55 + gap * 3), 5, 96);
}

function calculateWoundRisk(gap, difficulty, success, team = []) {
  const base = success ? 18 : 34;
  const teamReduction = team.reduce((sum, character) => sum + (getCareerConfig(character)?.effects?.teamWoundRiskReduction ?? 0), 0);
  return clamp(Math.round(base + difficulty * 4 - gap * 1.4 - teamReduction), 4, 88);
}

function calculateDeathRisk(gap, difficulty, character, team = [], success = true) {
  const armorReduction = getArmorDeathRiskReduction(character);
  const conditionRisk = getConditionDeathRiskModifier(character);
  const positiveReduction = getPositiveDeathRiskReduction(character);
  const career = getCareerConfig(character);
  const category = getCareerCategoryConfig(character);
  const teamReduction = team.reduce((sum, member) => sum + (getCareerConfig(member)?.effects?.teamDeathRiskReduction ?? 0), 0);
  const failureReduction = success ? 0 : career?.effects?.failureDeathRiskReduction ?? 0;
  const categoryReduction = category?.effects?.deathRiskReduction ?? 0;
  return clamp(Math.round(1 + difficulty * 2 - gap * 0.6 + conditionRisk - armorReduction - positiveReduction - teamReduction - failureReduction - categoryReduction), 1, 65);
}

function getArmorDeathRiskReduction(character) {
  const armor = character.equipment?.armor;
  if (!armor) return 0;
  const career = getCareerConfig(character);
  const armorBonus = career?.effects?.armorDeathRiskBonus ?? 0;
  const multiplierBonus = career?.effects?.armorDeathRiskMultiplier ?? 0;
  return Math.round((armor.deathRiskReduction ?? 0) * (1 + multiplierBonus) + armorBonus);
}

function getConditionDeathRiskModifier(character) {
  return (character.conditions ?? []).reduce((sum, condition) => sum + (condition.deathRiskModifier ?? 0), 0);
}

function getPositiveDeathRiskReduction(character) {
  return (character.positiveConditions ?? []).reduce((sum, condition) => sum + (condition.deathRiskReduction ?? 0), 0);
}

function calculateMissionStressGain(character, success) {
  const base = success ? randomNumber(2, 5) : randomNumber(8, 16);
  const category = getCareerCategoryConfig(character);
  const career = getCareerConfig(character);
  const rateReduction = category?.effects?.stressGainReduction ?? 0;
  const flatReduction = success ? career?.effects?.successStressReduction ?? 0 : 0;
  const flatBonus = (career?.effects?.stressGainFlat ?? 0) + (!success ? career?.effects?.failureStressBonus ?? 0 : 0);
  return Math.max(0, Math.round(base * (1 - rateReduction)) - flatReduction + flatBonus);
}

function getRewardGoldMultiplier(team) {
  const bonus = team.reduce((sum, character) => sum + (getCareerCategoryConfig(character)?.effects?.rewardGoldBonus ?? 0), 0);
  return 1 + Math.min(0.25, bonus);
}

function calculateRefreshCost(difficulty = 2) {
  const config = economyConfig.contracts.costs;
  return config.refreshBase + difficulty * config.refreshPerDifficulty;
}

function calculateMissionAdvancePayment(mission) {
  if (mission.advancePaid) return mission.advancePaid;
  const range = economyConfig.contracts.advancePaymentRates[mission.typeCode] ?? economyConfig.contracts.advancePaymentRates.fallback;
  const [minRate, maxRate] = range;
  const rate = minRate + Math.random() * (maxRate - minRate);
  return Math.max(0, Math.floor((mission.reward?.gold ?? 0) * rate));
}

function calculateInvestigateCost({ rewardGold = 0, difficulty = 2 } = {}) {
  const config = economyConfig.contracts.costs;
  const fallbackReward =
    rewardGold > 0
      ? rewardGold
      : economyConfig.contracts.reward.baseGold + difficulty * economyConfig.contracts.reward.goldPerDifficultyMin;
  const rate = config.investigationRewardRateMin + Math.random() * (config.investigationRewardRateMax - config.investigationRewardRateMin);
  return Math.max(config.investigationMinCost, Math.round(fallbackReward * rate));
}

function calculateDiscountedInvestigateCost(draft, mission, mode = "targeted") {
  const baseCost = mission.investigateCost ?? calculateInvestigateCost({ rewardGold: mission.reward?.gold, difficulty: mission.difficulty ?? 2 });
  const config = economyConfig.contracts.costs;
  const modeMultiplier =
    mode === "random" ? config.randomInvestigationMultiplier : mode === "power" ? config.powerInvestigationMultiplier : 1;
  const rosterDiscount = draft.roster
    .filter((character) => character.status !== "阵亡")
    .reduce((sum, character) => {
      const category = getCareerCategoryConfig(character);
      const career = getCareerConfig(character);
      return sum + (category?.effects?.investigateDiscount ?? 0) + (career?.effects?.investigateDiscount ?? 0);
    }, 0);
  const facilityDiscount = (draft.buildings?.intel ?? 0) * economyConfig.facilities.intelInvestigationDiscountPerLevel;
  const discount = Math.min(config.maxInvestigationDiscount, rosterDiscount + facilityDiscount);
  return Math.max(1, Math.round(baseCost * modeMultiplier * (1 - discount)));
}

function chooseInvestigationTarget(mission, intelKey = "random") {
  const revealed = mission.revealedIntel ?? [];
  const lockedFields = contractIntelFields.filter((field) => !revealed.includes(field.key));
  const canRefinePowerIntel = (mission.powerIntelLevel ?? 0) < 3;

  if (intelKey === "power") {
    return canRefinePowerIntel ? { key: "power", label: "战斗力需求区间", mode: "power" } : null;
  }

  if (intelKey && intelKey !== "random") {
    const field = contractIntelFields.find((item) => item.key === intelKey);
    if (!field || revealed.includes(field.key)) return null;
    return { key: field.key, label: field.label, mode: "targeted" };
  }

  const candidates = [...lockedFields];
  if (canRefinePowerIntel) candidates.push({ key: "power", label: "战斗力需求区间" });
  const field = randomItem(candidates);
  if (!field) return null;
  return { key: field.key, label: field.label, mode: field.key === "power" ? "power" : "random" };
}

function resolveGrowthDraft(draft, character, actionType) {
  const currentRank = mercenaryRanks.includes(character.rank) ? character.rank : "无";
  const category = getCareerCategoryConfig(character);
  const career = getCareerConfig(character);
  const chance = (promotionChances[currentRank] ?? 0) + (category?.effects?.growthChanceBonus ?? 0) + (career?.effects?.growthChanceBonus ?? 0);
  if (randomNumber(1, 100) > chance) return;

  if (randomNumber(1, 100) <= 50) {
    resolvePromotionDraft(draft, character, actionType);
    return;
  }

  const extraPointChance = 15 + (career?.effects?.extraEnhancementPointChance ?? 0);
  const points = 1 + (randomNumber(1, 100) <= extraPointChance ? 1 : 0);
  draft.enhancementPoints = (draft.enhancementPoints ?? 0) + points;
  draft.log.push(`第 ${draft.day} 天：${character.name} 从契约里为基地攒下 ${points} 点强化点。`);
}

function resolvePromotionDraft(draft, character, actionType) {
  const currentRank = mercenaryRanks.includes(character.rank) ? character.rank : "无";
  const currentIndex = mercenaryRanks.indexOf(currentRank);
  if (currentIndex < 0 || currentIndex >= mercenaryRanks.length - 1) return;

  const nextRank = mercenaryRanks[currentIndex + 1];
  const positiveCondition = drawPositiveCondition(character, "promotion");
  const powerGain = getPromotionCombatPowerGain(nextRank);
  character.rank = nextRank;
  character.level = currentIndex + 1;
  character.combatPower = (character.combatPower ?? 0) + powerGain;
  if (positiveCondition) {
    character.positiveConditions ??= [];
    character.positiveConditions.push(positiveCondition);
  }

  const conditionText = positiveCondition ? `，获得正面状态「${positiveCondition.name}」` : "";
  draft.log.push(`第 ${draft.day} 天：${character.name} 晋升为 ${nextRank} 级佣兵，战斗力 +${powerGain}${conditionText}。`);
}

function applyNegativeConditionDraft(draft, character, options = {}) {
  character.conditions ??= [];
  const condition = { ...drawNegativeCondition(options), id: createId(), day: draft.day };
  character.conditions.push(condition);
  character.wound += condition.wound ?? 0;
  character.stress += (condition.stress ?? 0) + getSeverityStress(condition.severity);
  character.hp = Math.max(1, character.hp - Math.max(3, (condition.wound ?? 0) * 5));
  draft.log.push(`第 ${draft.day} 天：${character.name} 获得负面状态「${condition.name}」。`);
}

function drawNegativeCondition(options = {}) {
  const severity = options.severity ?? "light";
  const damageType = options.damageType;
  const byDamageType = negativeConditions.filter(
    (condition) =>
      condition.category === "physical" &&
      condition.severity === severity &&
      (!damageType || condition.damageTypes?.includes(damageType))
  );
  const bySeverity = negativeConditions.filter((condition) => condition.category === "physical" && condition.severity === severity);
  return randomItem(byDamageType.length > 0 ? byDamageType : bySeverity);
}

function maybeApplyDamageTypeConditionDraft(draft, character, mission, gap, success) {
  const enemyDamageTypes = mission.requirements?.damageTypes ?? [];
  if (enemyDamageTypes.length === 0) return;
  const matched = hasMatchingArmor(character, enemyDamageTypes);
  const base = success ? 12 : 24;
  const gapPressure = Math.max(0, Math.round((mission.powerRequirement - (mission.powerRequirement + gap)) / 4));
  const chance = clamp(base + gapPressure + (matched ? -10 : 18), 1, 75);
  if (randomNumber(1, 100) > chance) return;
  applyNegativeConditionDraft(draft, character, {
    severity: chooseConditionSeverity(gap, mission.difficulty, success, !matched),
    damageType: randomItem(enemyDamageTypes),
    armorMatched: matched,
  });
}

function chooseConditionSeverity(gap, difficulty, success, armorMismatch = false) {
  const score = difficulty + (success ? 0 : 3) + Math.max(0, Math.ceil(-gap / 8)) + (armorMismatch ? 2 : 0);
  if (score >= 8) return "heavy";
  if (score >= 4) return "medium";
  return "light";
}

function hasMatchingArmor(character, damageTypes) {
  const armor = character.equipment?.armor;
  return Boolean(armor?.protectionType && damageTypes.includes(armor.protectionType));
}

function getSeverityStress(severity) {
  if (severity === "heavy") return 18;
  if (severity === "medium") return 10;
  return 4;
}

function resolveStressBreakDraft(draft, character) {
  if (character.status === "阵亡" || (character.stress ?? 0) < 100) return;
  character.stress = 0;
  character.conditions ??= [];
  const severity = randomNumber(1, 100) <= 35 ? "heavy" : "medium";
  const condition = { ...randomItem(mentalConditions.filter((item) => item.severity === severity)), id: createId(), day: draft.day };
  character.conditions.push(condition);
  draft.log.push(`第 ${draft.day} 天：${character.name} 压力崩溃，获得精神疾病「${condition.name}」。`);
}

function recoverRestingStressDraft(draft) {
  draft.roster
    .filter((character) => character.status === "待命" && character.stress > 0)
    .forEach((character) => {
      const recoveryBonus = (character.positiveConditions ?? []).reduce((sum, condition) => sum + (condition.stressRecoveryBonus ?? 0), 0);
      character.stress = Math.max(0, character.stress - randomNumber(1, 5) - recoveryBonus);
    });
}

function distributeContractReputationDraft(draft, team, reputation) {
  if (reputation <= 0) return;
  const entities = [{ type: "base" }, ...team.map((character) => ({ type: "mercenary", character }))];
  for (let point = 0; point < reputation; point += 1) {
    const target = randomItem(entities);
    if (target.type === "base") {
      draft.reputation = (draft.reputation ?? 0) + 1;
    } else {
      target.character.personalReputation = (target.character.personalReputation ?? 0) + 1;
    }
  }
}

function calculateMissionReputationLoss(mission, teamSize) {
  const totalEntities = Math.max(1, teamSize + 1);
  const successReputation = Math.max(0, mission.reward?.reputation ?? 0);
  const config = economyConfig.contracts.reputationFailure;
  const maxTotalLoss = Math.max(0, Math.floor(successReputation * config.maxRate));
  if (maxTotalLoss <= 0) return 0;
  return Math.max(config.minLoss, Math.floor(maxTotalLoss / totalEntities));
}

function applyContractReputationLossDraft(draft, team, reputationLoss) {
  if (reputationLoss <= 0) return;
  draft.reputation = Math.max(0, (draft.reputation ?? 0) - reputationLoss);
  team.forEach((character) => {
    character.personalReputation = Math.max(0, (character.personalReputation ?? 0) - reputationLoss);
  });
}

function drawPositiveCondition(character, source = "growth") {
  const owned = new Set((character.positiveConditions ?? []).map((condition) => condition.name));
  const pool = positiveConditions.filter((condition) => !owned.has(condition.name));
  const condition = randomItem(pool.length > 0 ? pool : positiveConditions);
  return condition ? { ...condition, id: createId(), source, day: getState().day } : null;
}

function applyHiddenTwistDraft(draft, mission, team, success) {
  const twist = mission.hidden?.twist ?? "";
  const revealedCount = mission.revealedIntel?.length ?? 0;
  const mitigated = revealedCount >= 3;
  const result = { goldDelta: 0, reputationDelta: 0, text: `隐藏情报：${twist}` };

  if (twist.includes("情报错误")) {
    const stress = mitigated ? 1 : 3;
    team.forEach((character) => {
      character.stress += stress;
    });
    result.text += mitigated ? " 事前调查降低了混乱。" : " 错误情报让队伍压力上升。";
  } else if (twist.includes("第三方介入")) {
    const loss = mitigated ? 6 : 16;
    result.goldDelta -= loss;
    draft.stealth = clamp(draft.stealth - (mitigated ? 1 : 4), 0, 100);
    result.text += mitigated ? " 第三方被提前识别，只损失少量收益。" : " 第三方截走部分收益并留下追踪痕迹。";
  } else if (twist.includes("伏击")) {
    const target = randomItem(team);
    if (target && !mitigated) {
      target.wound += 1;
      target.hp = Math.max(1, target.hp - randomNumber(4, 9));
      target.stress += 4;
      result.text += ` ${target.name} 在伏击中受伤。`;
    } else {
      result.text += " 伏击被提前规避。";
    }
  } else if (twist.includes("客户欺骗")) {
    result.reputationDelta -= success ? 2 : 0;
    draft.stealth = clamp(draft.stealth - (mitigated ? 2 : 6), 0, 100);
    result.text += mitigated ? " 欺骗被留档，影响有限。" : " 客户留下麻烦尾巴，隐秘值下降。";
  } else if (twist.includes("隐藏奖励")) {
    const bonus = mitigated ? 24 : 14;
    result.goldDelta += bonus;
    result.text += ` 现场额外回收物资，追加 ${bonus} 金。`;
  } else if (twist.includes("目标背叛")) {
    result.reputationDelta += success && mitigated ? 2 : -1;
    team.forEach((character) => {
      character.stress += mitigated ? 1 : 2;
    });
    result.text += mitigated ? " 背叛被控制，反而提高了业内评价。" : " 目标背叛让委托评价受损。";
  }

  const eventResult = applyContractRandomEventDraft(draft, mission, team, success, revealedCount);
  result.goldDelta += eventResult.goldDelta;
  result.reputationDelta += eventResult.reputationDelta;
  if (eventResult.text) result.text += ` ${eventResult.text}`;

  return result;
}

function upgradeMissionToContract(mission) {
  if (mission.issuer && mission.type && mission.intel && mission.hidden) return mission;

  const fallbackTemplate = missionTemplates.find((template) => template.name === mission.name) ?? randomItem(missionTemplates);
  const fallbackType = contractTypes.find((type) => type.tags.some((tag) => (mission.tags ?? fallbackTemplate.tags).includes(tag))) ?? randomItem(contractTypes);
  mission.issuer ??= randomIssuer();
  mission.type ??= fallbackType.name;
  mission.typeCode ??= fallbackType.code;
  mission.actionType ??= fallbackType.actionType ?? "logistics";
  mission.acquisition ??= "旧合同转录";
  mission.description ??= `${randomItem(fallbackType.verbs)}目标。${randomItem(contractBriefFragments)}`;
  mission.intel ??= createContractIntel();
  mission.revealedIntel ??= [];
  mission.hidden ??= { twist: randomContractHiddenTwist() };
  normalizeContractPlanningFields(mission);
  mission.refreshCost ??= calculateRefreshCost(mission.difficulty ?? fallbackTemplate.difficulty ?? 2);
  mission.investigateCost ??= calculateInvestigateCost({ rewardGold: mission.reward?.gold, difficulty: mission.difficulty ?? fallbackTemplate.difficulty ?? 2 });
  mission.issueDay ??= 1;
  mission.expiresDay ??= mission.issueDay + 4;
  return mission;
}

function applyContractRandomEventDraft(draft, mission, team, success, revealedCount = 0) {
  let goldDelta = 0;
  let reputationDelta = 0;
  const texts = [];
  const used = new Set();
  const rolls = getContractRandomEventRolls(mission);
  const chance = getContractRandomEventChance(mission);

  for (let index = 0; index < rolls; index += 1) {
    if (chance <= 0 || Math.random() * 100 > chance) continue;
    const event = pickContractRandomEvent(draft, mission, revealedCount, used);
    if (!event) continue;
    used.add(event.id);

    const severity = event.tone === "negative" ? getNegativeEventSeverityMultiplier(draft, mission) : 1;
    const effect = event.effect ?? {};

    if (effect.gold) goldDelta += Math.round(effect.gold * severity);
    if (effect.reputation) reputationDelta += Math.round(effect.reputation * severity);
    if (effect.stealth) {
      draft.stealth = clamp(draft.stealth + Math.round(effect.stealth * severity), 0, 100);
    }
    if (effect.stress) {
      team.forEach((character) => {
        character.stress = Math.max(0, character.stress + Math.round(effect.stress * severity));
      });
    }
    if (effect.wound) {
      team.forEach((character) => {
        if (effect.wound < 0) {
          character.wound = Math.max(0, character.wound + effect.wound);
        } else if (Math.random() <= 0.5) {
          character.wound += effect.wound;
        }
      });
    }
    if (effect.successBonus && success) {
      goldDelta += effect.successBonus.gold ?? 0;
      reputationDelta += effect.successBonus.reputation ?? 0;
    }

    let text = `随机事件：${event.title}。${event.description}`;
    if (event.tone === "negative" && effect.stealth) {
      text += " 隐秘值受到牵连。";
    }
    texts.push(text);
  }

  return { goldDelta, reputationDelta, text: texts.join(" ") };
}

function pickContractRandomEvent(draft, mission, revealedCount = 0, used = new Set()) {
  const missionCode = mission.typeCode ?? mission.issuer?.typeCode ?? mission.actionType ?? "";
  const actionType = mission.actionType ?? "";
  const difficulty = mission.difficulty ?? 1;
  const intelLevel = Math.min(3, revealedCount);
  const intelRoomReduction = clamp(
    (draft.buildings?.intel ?? 0) * economyConfig.contracts.hiddenTwists.negativeEventWeightReductionPerIntelLevel,
    0,
    1 - economyConfig.contracts.hiddenTwists.negativeEventMinWeightMultiplier
  );
  const candidates = contractRandomEvents
    .filter((event) => !used.has(event.id))
    .filter((event) => difficulty >= (event.minDifficulty ?? 1) && difficulty <= (event.maxDifficulty ?? 8))
    .filter((event) => event.appliesTo.includes(missionCode) || event.appliesTo.includes(actionType) || event.appliesTo.includes("all"))
    .map((event) => {
      const baseWeight = event.weight ?? 1;
      let weight = baseWeight;
      if (event.tone === "negative") {
        const reduction = Math.max(0, intelLevel) * 0.08 + intelRoomReduction;
        const multiplier = Math.max(
          economyConfig.contracts.hiddenTwists.negativeEventMinWeightMultiplier,
          1 - reduction
        );
        weight *= multiplier;
      }
      return { event, weight: Math.max(0, weight) };
    })
    .filter((entry) => entry.weight > 0);

  const total = candidates.reduce((sum, entry) => sum + entry.weight, 0);
  if (total <= 0) return null;
  let roll = Math.random() * total;
  for (const entry of candidates) {
    roll -= entry.weight;
    if (roll <= 0) return entry.event;
  }
  return candidates[candidates.length - 1]?.event ?? null;
}

function getContractRandomEventRolls(mission) {
  const difficulty = mission.difficulty ?? 1;
  const tiers = economyConfig.contracts.hiddenTwists.randomEventRollsByDifficulty ?? [];
  const tier = tiers.find((entry) => difficulty <= entry.maxDifficulty);
  return Math.max(0, tier?.rolls ?? 1);
}

function getContractRandomEventChance(mission) {
  const config = economyConfig.contracts.hiddenTwists;
  return clamp(
    (config.randomEventChance ?? 0) + Math.max(0, (mission.difficulty ?? 1) - 1) * (config.randomEventChancePerDifficulty ?? 0),
    0,
    95
  );
}

function getNegativeEventSeverityMultiplier(draft, mission) {
  const intelLevel = Math.max(0, mission.powerIntelLevel ?? 0, mission.revealedIntel?.length ?? 0);
  const facilityBonus = (draft.buildings?.intel ?? 0) * economyConfig.contracts.hiddenTwists.negativeEventWeightReductionPerIntelLevel;
  return clamp(1 - intelLevel * 0.1 - facilityBonus * 0.5, 0.35, 1);
}

function randomContractHiddenTwist() {
  const weights = economyConfig.contracts.hiddenTwists.weights ?? {};
  const weighted = contractHiddenTwists.map((twist) => ({
    twist,
    weight: Math.max(0, weights[twist] ?? 1),
  }));
  const total = weighted.reduce((sum, item) => sum + item.weight, 0);
  if (total <= 0) return randomItem(contractHiddenTwists);
  let roll = Math.random() * total;
  for (const item of weighted) {
    roll -= item.weight;
    if (roll <= 0) return item.twist;
  }
  return weighted[weighted.length - 1]?.twist ?? randomItem(contractHiddenTwists);
}
