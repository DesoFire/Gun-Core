<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gun Core Demo - Playable</title>
    <style>
:root {
  color-scheme: dark;
  --bg: #101113;
  --panel: #191b1f;
  --panel-soft: #20242a;
  --line: #343941;
  --text: #f2efe7;
  --muted: #a9abb1;
  --accent: #d0a85c;
  --accent-strong: #e0bd70;
  --danger: #b9564f;
  --good: #70af78;
  --info: #6f9dbd;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 30% 0%, #252933 0, #101113 42%);
  color: var(--text);
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
  min-height: 36px;
  padding: 0 12px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.link-button {
  background: transparent;
  border: 0;
  color: var(--accent);
  min-height: 0;
  padding: 0;
  text-align: left;
}

.app-shell {
  margin: 0 auto;
  max-width: 1440px;
  padding: 24px;
}

.topbar {
  align-items: center;
  display: flex;
  gap: 16px;
  justify-content: space-between;
  margin-bottom: 20px;
}

.topbar h1,
.organization-name {
  font-size: 34px;
  line-height: 1;
  margin: 4px 0 0;
}

.organization-name {
  background: transparent;
  border: 0;
  color: var(--text);
  cursor: pointer;
  display: block;
  font-weight: 800;
  min-height: 0;
  padding: 2px 4px;
  text-align: left;
}

.organization-name:hover {
  background: rgb(214 174 92 / 0.12);
  color: var(--accent-strong);
}

.eyebrow {
  color: var(--accent);
  font-size: 13px;
  letter-spacing: 0;
  margin: 0;
}

.top-actions,
.dialog-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.tabbar {
  background: #15171b;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding: 6px;
}

.global-status-drawer {
  position: fixed;
  right: 18px;
  top: 104px;
  z-index: 20;
}

.global-status-drawer.in-dialog {
  position: absolute;
  right: 54px;
  top: 12px;
  z-index: 6;
}

.global-status-toggle {
  background: var(--accent);
  border-color: var(--accent-strong);
  box-shadow: 0 10px 28px rgb(0 0 0 / 0.32);
  color: #181511;
  cursor: grab;
  font-weight: 800;
  touch-action: none;
  user-select: none;
}

.global-status-drawer.dragging .global-status-toggle {
  cursor: grabbing;
}

.global-status-panel {
  background: #15171b;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 18px 44px rgb(0 0 0 / 0.45);
  margin-top: 8px;
  padding: 12px;
  width: min(320px, calc(100vw - 32px));
}

.global-status-drawer.in-dialog .global-status-toggle {
  cursor: pointer;
}

.global-status-drawer.in-dialog .global-status-panel {
  position: absolute;
  right: 0;
  top: 38px;
  width: min(300px, calc(100vw - 72px));
}

.global-resource-strip {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 12px;
}

.strip-resource {
  background: #101317;
  border: 1px solid var(--line);
  border-radius: 6px;
  min-width: 0;
  padding: 7px 9px;
}

.strip-resource span {
  color: var(--muted);
  display: block;
  font-size: 11px;
}

.strip-resource strong {
  display: block;
  font-size: 16px;
  margin-top: 2px;
}

.tab-button {
  background: transparent;
  border-color: transparent;
  color: var(--muted);
  flex: 0 0 auto;
  min-width: 88px;
}

.tab-button.active {
  background: var(--panel-soft);
  border-color: var(--line);
  color: var(--text);
}

.subtabbar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
}

.subtab-button {
  background: #22262d;
  border-color: var(--line);
  color: var(--muted);
}

.subtab-button.active {
  background: var(--accent);
  border-color: var(--accent-strong);
  color: #181511;
  font-weight: 700;
}

.dashboard {
  display: block;
}

.tab-page {
  display: none;
}

.tab-page.active {
  display: block;
}

.tab-layout {
  display: grid;
  gap: 16px;
}

.tab-layout.two-column {
  grid-template-columns: minmax(320px, 1.2fr) minmax(280px, 0.8fr);
}

.overview-layout {
  display: grid;
  gap: 16px;
  grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
}

.panel {
  background: color-mix(in srgb, var(--panel) 92%, black);
  border: 1px solid var(--line);
  border-radius: 8px;
  min-width: 0;
  padding: 16px;
}

.command-panel {
  margin-bottom: 16px;
}

.overview-layout .command-panel,
.calendar-panel {
  grid-column: 1 / -1;
  margin-bottom: 0;
}

.command-grid {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.command-stat {
  background: #14171b;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px;
}

.command-stat span {
  color: var(--muted);
  display: block;
  font-size: 12px;
}

.command-stat strong {
  display: block;
  font-size: 20px;
  margin-top: 3px;
}

.status-active {
  border-color: var(--info);
  color: #a8cce4;
}

.status-won {
  border-color: var(--good);
  color: #9de0a5;
}

.status-lost {
  border-color: var(--danger);
  color: #e89a93;
}

.overview-list {
  display: grid;
  gap: 8px;
}

.overview-row {
  align-items: center;
  background: #14171b;
  border: 1px solid var(--line);
  border-radius: 6px;
  display: flex;
  gap: 12px;
  justify-content: space-between;
  min-height: 38px;
  padding: 8px 10px;
}

.overview-row span {
  color: var(--muted);
  font-size: 13px;
}

.overview-row strong {
  font-size: 13px;
  text-align: right;
}

.personnel-overview-grid {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(5, minmax(0, 1fr));
}

.personnel-metric {
  background: #14171b;
  border: 1px solid var(--line);
  border-radius: 7px;
  min-width: 0;
  padding: 10px;
}

.personnel-metric span {
  color: var(--muted);
  display: block;
  font-size: 11px;
}

.personnel-metric strong {
  display: block;
  font-size: 24px;
  margin-top: 4px;
}

.personnel-metric.primary strong,
.personnel-metric.power strong {
  color: var(--accent-strong);
  font-size: 30px;
}

.personnel-bars {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}

.personnel-bar {
  align-items: center;
  display: grid;
  gap: 8px;
  grid-template-columns: 44px minmax(0, 1fr) 42px;
}

.personnel-bar span,
.personnel-bar strong {
  color: var(--muted);
  font-size: 12px;
}

.personnel-bar i {
  background: #111419;
  border: 1px solid var(--line);
  border-radius: 999px;
  height: 10px;
  overflow: hidden;
}

.personnel-bar b {
  background: var(--good);
  display: block;
  height: 100%;
}

.personnel-bar.active b {
  background: var(--accent-strong);
}

.personnel-alert-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.personnel-alert-row span {
  background: #14171b;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-size: 12px;
  padding: 4px 9px;
}

.personnel-alert-row .danger {
  border-color: color-mix(in srgb, var(--danger) 55%, var(--line));
  color: #e89a93;
}

.personnel-alert-row .warning {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  color: var(--accent-strong);
}

.calendar-list {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(7, minmax(150px, 1fr));
  overflow-x: auto;
}

.calendar-page-panel {
  min-height: 70vh;
}

.calendar-list-large {
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.calendar-list-large .calendar-day {
  min-height: 260px;
  min-width: 220px;
}

.calendar-list-large .calendar-day-head strong {
  font-size: 16px;
}

.calendar-list-large .calendar-event {
  padding: 10px;
}

.calendar-list-large .calendar-event strong {
  font-size: 14px;
}

.calendar-list-large .calendar-event p {
  font-size: 12px;
}

.calendar-day {
  background: #14171b;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: grid;
  gap: 8px;
  min-height: 180px;
  min-width: 150px;
  padding: 10px;
}

.calendar-day.today {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
}

.calendar-day-head {
  align-items: center;
  display: flex;
  gap: 8px;
  justify-content: space-between;
}

.calendar-day-head strong {
  font-size: 13px;
}

.calendar-day-head span {
  color: var(--muted);
  font-size: 12px;
}

.calendar-events {
  display: grid;
  gap: 6px;
}

.calendar-event {
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-radius: 6px;
  padding: 7px;
}

.calendar-event span {
  color: var(--muted);
  display: block;
  font-size: 11px;
}

.calendar-event strong {
  display: block;
  font-size: 12px;
  line-height: 1.35;
  margin-top: 3px;
}

.calendar-event p {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
  margin: 4px 0 0;
}

.calendar-event.active {
  border-left-color: var(--info);
}

.calendar-event.done {
  border-left-color: var(--good);
}

.calendar-event.failed,
.calendar-event.missed {
  border-left-color: var(--danger);
}

.calendar-event.planned {
  border-left-color: var(--accent);
}

.section-heading {
  align-items: center;
  display: flex;
  gap: 10px;
  justify-content: space-between;
  margin-bottom: 12px;
}

h2,
h3,
p {
  margin-top: 0;
}

h2 {
  font-size: 18px;
  margin-bottom: 0;
}

h3 {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 10px;
}

.resource-grid {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.resource {
  background: var(--panel-soft);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px;
}

.resource span,
.muted {
  color: var(--muted);
  font-size: 12px;
}

.resource strong {
  display: block;
  font-size: 22px;
  margin-top: 3px;
}

.stack {
  display: grid;
  gap: 10px;
}

.card-grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.mission-grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
}

.contract-toolbar {
  margin: -4px 0 12px;
  max-width: 760px;
}

.placeholder-grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}

.facility-grid {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}

.facility-card {
  cursor: pointer;
  display: grid;
  gap: 10px;
  min-height: 150px;
}

.facility-card:hover {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
}

.facility-card.locked {
  background: #171a1f;
  border-style: dashed;
}

.wealth-grid {
  display: grid;
  gap: 14px;
}

.wealth-room {
  background: #14171b;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: grid;
  gap: 12px;
  padding: 14px;
}

.wealth-item-grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}

.wealth-item {
  align-items: start;
  background: var(--panel-soft);
  border: 1px solid var(--line);
  border-radius: 7px;
  display: grid;
  gap: 10px;
  grid-template-columns: minmax(0, 1fr) auto;
  min-height: 112px;
  padding: 12px;
}

.wealth-item.owned {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
}

.wealth-item strong {
  display: block;
  font-size: 14px;
  margin-bottom: 5px;
}

.expense-summary-grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  margin-bottom: 14px;
}

.expense-summary-card {
  background: #14171b;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 12px;
}

.expense-summary-card span {
  color: var(--muted);
  display: block;
  font-size: 12px;
}

.expense-summary-card strong {
  display: block;
  font-size: 24px;
  margin-top: 4px;
}

.expense-summary-card p {
  margin: 4px 0 0;
}

.expense-grid {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

.expense-section {
  background: #14171b;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: grid;
  gap: 10px;
  padding: 12px;
}

.expense-section h3 {
  color: var(--accent);
  margin-bottom: 4px;
}

.expense-line-list {
  display: grid;
  gap: 7px;
}

.expense-line {
  align-items: center;
  background: var(--panel-soft);
  border: 1px solid var(--line);
  border-radius: 6px;
  display: grid;
  gap: 6px;
  grid-template-columns: minmax(0, 1fr) auto;
  min-height: 44px;
  padding: 8px 10px;
}

.expense-line span,
.expense-line small {
  min-width: 0;
}

.expense-line span {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.expense-line small {
  color: var(--muted);
  font-size: 11px;
  grid-column: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.expense-line strong {
  font-size: 13px;
  grid-column: 2;
  grid-row: 1 / span 2;
  text-align: right;
}

.expense-approval-section {
  align-items: center;
  border-color: color-mix(in srgb, var(--good) 45%, var(--line));
  grid-column: 1 / -1;
  grid-template-columns: minmax(0, 1fr) auto;
}

.approve-button {
  background: var(--good);
  border-color: #9de0a5;
  color: #07140a;
  font-weight: 800;
  min-width: 220px;
}

.placeholder-card {
  background: #14171b;
  border: 1px dashed var(--line);
  border-radius: 8px;
  min-height: 120px;
  padding: 14px;
}

.weapon-generator-panel {
  display: grid;
  gap: 12px;
}

.weapon-card {
  background: var(--panel-soft);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}

.rarity-F {
  border-color: #6f737a;
}

.rarity-E {
  border-color: #82908a;
}

.rarity-D {
  border-color: #6f9dbd;
}

.rarity-C {
  border-color: var(--accent);
}

.rarity-B {
  border-color: #70af78;
}

.rarity-A {
  border-color: #b985d6;
}

.rarity-S {
  border-color: #e0bd70;
  box-shadow: 0 0 0 1px color-mix(in srgb, #e0bd70 45%, transparent);
}

.card {
  background: var(--panel-soft);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}

.character-card,
.recruit-card {
  display: grid;
  gap: 10px;
}

.character-kpi-grid {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.character-kpi {
  background: #171a1f;
  border: 1px solid var(--line);
  border-radius: 7px;
  min-width: 0;
  padding: 8px;
}

.character-kpi span {
  color: var(--muted);
  display: block;
  font-size: 11px;
}

.character-kpi strong {
  display: block;
  font-size: 18px;
  line-height: 1.1;
  margin-top: 3px;
}

.character-kpi small {
  color: var(--muted);
  display: block;
  font-size: 10px;
  line-height: 1.25;
  margin-top: 4px;
}

.character-kpi.primary strong {
  color: var(--accent-strong);
  font-size: 24px;
}

.character-kpi.warning strong {
  color: var(--accent-strong);
}

.character-kpi.danger strong {
  color: #e89a93;
}

.character-kpi.cost strong {
  color: #9de0a5;
}

.character-meta-row {
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  font-size: 12px;
  gap: 8px;
}

.character-meta-row span {
  background: #171a1f;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 7px;
}

.identity-line {
  align-items: center;
  display: flex;
  gap: 10px;
  min-width: 0;
}

.identity-line > div {
  min-width: 0;
}

.identity-line-large {
  gap: 12px;
}

.merc-avatar {
  align-items: center;
  aspect-ratio: 1;
  background:
    radial-gradient(circle at 30% 24%, color-mix(in srgb, var(--avatar-ring) 38%, transparent), transparent 38%),
    var(--avatar-bg);
  border: 1px solid color-mix(in srgb, var(--avatar-ring) 72%, #ffffff 8%);
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, #ffffff 12%, transparent);
  color: var(--avatar-fg);
  display: inline-flex;
  flex: 0 0 auto;
  font-weight: 800;
  justify-content: center;
  letter-spacing: 0;
  line-height: 1;
  overflow: hidden;
}

.merc-avatar span {
  transform: translateY(-1px);
}

.merc-avatar-small {
  font-size: 12px;
  height: 26px;
  width: 26px;
}

.merc-avatar-medium {
  font-size: 16px;
  height: 38px;
  width: 38px;
}

.merc-avatar-large {
  font-size: 22px;
  height: 54px;
  width: 54px;
}

.contract-team-strip {
  align-items: center;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  font-size: 12px;
  gap: 6px;
}

.contract-team-strip .merc-avatar {
  margin-right: -4px;
}

.contract-team-strip-large {
  margin-top: 10px;
}

.contract-team-strip-large span {
  margin-left: 4px;
}

.contract-card {
  display: grid;
  gap: 10px;
}

.contract-summary-card {
  cursor: pointer;
}

.contract-summary-card:hover {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
}

.contract-brief {
  color: var(--text);
  font-size: 13px;
  line-height: 1.55;
  margin: 0;
}

.contract-public {
  display: grid;
  gap: 6px;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
}

.contract-public span {
  background: #171a1f;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted);
  font-size: 12px;
  min-width: 0;
  padding: 7px 8px;
  text-align: center;
}

.contract-intel-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.contract-intel-chips span {
  background: color-mix(in srgb, var(--accent) 12%, #171a1f);
  border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--line));
  border-radius: 999px;
  color: var(--text);
  font-size: 12px;
  padding: 5px 8px;
}

.intel-action-grid {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  margin-top: 10px;
}

.intel-action {
  align-items: center;
  background: #171a1f;
  border: 1px solid var(--line);
  border-radius: 7px;
  display: grid;
  gap: 10px;
  grid-template-columns: minmax(0, 1fr) auto;
  min-height: 70px;
  padding: 10px;
}

.intel-action strong {
  display: block;
  font-size: 13px;
  margin-bottom: 4px;
}

.intel-action.revealed {

// ===== js/router.js =====
function initRouter({ onChange } = {}) {
  const buttons = document.querySelectorAll("[data-tab-target]:not([hidden])");
  const pages = document.querySelectorAll("[data-tab-page]:not([hidden])");

  function switchTab(tabName) {
    buttons.forEach((button) => {
      button.classList.toggle("active", button.dataset.tabTarget === tabName);
    });
    pages.forEach((page) => {
      page.classList.toggle("active", page.dataset.tabPage === tabName);
    });
    onChange?.(tabName);
  }

  buttons.forEach((button) => {
    button.addEventListener("click", () => switchTab(button.dataset.tabTarget));
  });

  const activeVisibleTab = document.querySelector("[data-tab-target].active:not([hidden])")?.dataset.tabTarget;
  switchTab(activeVisibleTab ?? "overview");
  return { switchTab };
}

// ===== js/utils.js =====
function randomItem(items) {
  return items[Math.floor(Math.random() * items.length)];
}

function randomNumber(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function createId() {
  return crypto.randomUUID();
}




// ===== modules/combatPower.js =====
function estimateBaseCombatPower(character) {
  const basePower = character.combatPower ?? 20;
  const rankIndex = Math.max(0, mercenaryRanks.indexOf(character.rank));
  return Math.max(10, Math.round(basePower + rankIndex * 3));
}

function calculateEquipmentCombatPower(character) {
  if (hasLostBothArms(character)) return 0;
  return Object.values(character.equipment ?? {})
    .filter(Boolean)
    .reduce((sum, item) => sum + getItemCombatPower(item), 0);
}

function calculateCharacterCombatPower(character) {
  const basePower = character.combatPower ?? estimateBaseCombatPower(character);
  return Math.max(1, Math.round(basePower + calculateEquipmentCombatPower(character) + getPositiveConditionCombatPower(character) + getClassDamagePowerBonus(character)));
}

function calculateEffectiveCharacterCombatPower(character) {
  const injuryPenalty = Math.round((character.wound ?? 0) * 4 * (1 - getWoundPenaltyReduction(character)));
  const stressPenalty = Math.floor((character.stress ?? 0) / 5);
  const conditionPenalty = (character.conditions ?? []).reduce((sum, condition) => sum + (condition.powerPenalty ?? 0), 0);
  return Math.max(1, calculateCharacterCombatPower(character) - injuryPenalty - stressPenalty - conditionPenalty);
}

function calculateTeamCombatPower(roster, memberIds) {
  return roster
    .filter((character) => memberIds.includes(character.id))
    .reduce((sum, character) => sum + calculateEffectiveCharacterCombatPower(character), 0);
}

function getItemCombatPower(item) {
  if (item.itemCategory === "weapon" || item.slot === "weapon") return clamp(item.power ?? 0, 0, 400);
  return 0;
}

function getPromotionCombatPowerGain(nextRank) {
  const gains = {
    F: 2,
    E: 4,
    D: 8,
    C: 16,
    B: 32,
    A: 64,
    S: 128,
  };
  return gains[nextRank] ?? 0;
}

function rarityBonus(rarity) {
  return Math.max(0, ["F", "E", "D", "C", "B", "A", "S"].indexOf(rarity));
}

function hasLostBothArms(character) {
  const limbs = new Set((character.conditions ?? []).map((condition) => condition.limb).filter(Boolean));
  return limbs.has("leftArm") && limbs.has("rightArm");
}

function getPositiveConditionCombatPower(character) {
  return (character.positiveConditions ?? []).reduce((sum, condition) => sum + (condition.powerBonus ?? 0), 0);
}

function getClassDamagePowerBonus(character) {
  const career = getCareer(character);
  const bonus = career?.effects?.damageTypePowerBonus;
  const weapon = character.equipment?.weapon;
  if (!bonus || !weapon || weapon.damageType !== bonus.type) return 0;
  return bonus.value ?? 0;
}

function getWoundPenaltyReduction(character) {
  const career = getCareer(character);
  return career?.effects?.woundPenaltyReduction ?? 0;
}

function getCareer(character) {
  return characterClasses[character.classId];
}

function getState() {

function updateState(mutator, options = {}) {
  mutator(state);
  state = normalizeState(state);
  if (options.save !== false) saveState();
  if (options.notify !== false) notify();
}

function subscribe(listener) {
  listeners.add(listener);
  return () => listeners.delete(listener);
}

function addLog(message) {
  updateState((draft) => {
    draft.log.push(`第 ${draft.day} 天：${message}`);
  });
}

function saveState() {
  getStorage()?.setItem(STORAGE_KEY, JSON.stringify(state));
}

function resetState() {
  getStorage()?.removeItem(STORAGE_KEY);
  state = normalizeState(createInitialState());
  saveState();
  notify();
}

function loadState() {
  const storage = getStorage();
  const saved = storage?.getItem(STORAGE_KEY);

  try {

  } catch {
    storage?.removeItem(STORAGE_KEY);
    return null;
  }
}

function getStorage() {
  return typeof globalThis.localStorage !== "undefined" &&
    typeof globalThis.localStorage.getItem === "function" &&
    typeof globalThis.localStorage.setItem === "function"
    ? globalThis.localStorage
    : null;
}

function normalizeState(savedState) {
  savedState.gameStatus ??= "active";

    sampleItems.forEach((item) => {
      if (!existingIds.has(item.id)) savedState.inventory.push({ ...item });
    });
    savedState.inventorySeeded = true;
  }
  savedState.factions ??= [];
  savedState.log ??= [];

  Object.keys(buildings).forEach((id) => {
    savedState.buildings[id] ??= 0;
  });

  const usedAvatarKeys = new Set();
  savedState.roster = savedState.roster.map((character) => normalizeCharacterState(character, usedAvatarKeys));
  savedState.recruitPool = savedState.recruitPool.map((character) => normalizeCharacterState(character, usedAvatarKeys));
  savedState.enhancementPoints += collectLegacyEnhancementPoints(savedState.roster);
  savedState.enhancementPoints += collectLegacyEnhancementPoints(savedState.recruitPool);

    id: createId(),
    name: customName || createRandomName(),

function normalizeCharacterState(character, usedAvatarKeys = new Set()) {
  if (character.personalReputation == null && character.notoriety != null) character.personalReputation = character.notoriety;
  delete character.notoriety;
  character.personalReputation ??= character.isPlayer ? 3 : 1;
  splitLegacyName(character);
  character.name = (character.name || createRandomName()).trim().slice(0, 32);
  character.callsign ??= createCallsign();
  if (character.callsign.length > 12) character.callsign = createCallsign();
  character.callsign = character.callsign.trim().slice(0, 24);
  character.conditions ??= [];
  character.conditions = character.conditions.map(normalizeConditionState);
  character.positiveConditions ??= [];
  character.positiveConditions = character.positiveConditions.map(normalizePositiveConditionState);
  character.rank = normalizeRank(character);
  character.level = Math.max(0, mercenaryRanks.indexOf(character.rank));
  character.xp ??= 0;
  delete character.traits;
  character.dossier ??= createDossier();
  character.dossier.personality ??= randomItem(personalities);
  character.contractRecord ??= { completed: 0, failed: 0, survived: 0 };
  character.bounty ??= randomNumber(0, 24) * 10;
  character.debt ??= randomNumber(0, 18) * 5;
  character.signingMultiplier ??= randomNumber(economyConfig.recruitment.signingMultiplierMin, economyConfig.recruitment.signingMultiplierMax);
  character.wound ??= 0;
  character.stress ??= 0;
  character.status ??= "待命";
  character.tags ??= [];
  if (!characterClasses[character.classId]) character.classId = "assault";
  const baseClass = characterClasses[character.classId];
  const category = careerCategories[baseClass.category];
  character.className = baseClass.name;
  character.careerCategory = baseClass.category;
  character.careerCategoryName = category?.name ?? "未分类";
  character.combatPower ??= estimateBaseCombatPower(character);
  character.maxHp ??= baseClass.maxHp ?? 24;
  character.hp ??= Math.max(1, character.maxHp - character.wound * 4);
  if (character.hp <= 0) character.status = "阵亡";
  character.equipment = { ...createEmptyEquipment(), ...(character.equipment ?? {}) };
  character.equipment = normalizeEquipmentSlots(character.equipment);
  character.avatar = normalizeAvatar(character, usedAvatarKeys);
  return character;
}

function collectLegacyEnhancementPoints(characters = []) {
  return characters.reduce((sum, character) => {
    const points = character.enhancementPoints ?? 0;
    delete character.enhancementPoints;

  if (mercenaryRanks.includes(character.rank)) return character.rank;
  if (typeof character.level === "number") return mercenaryRanks[Math.min(character.level, mercenaryRanks.length - 1)] ?? "无";

    突袭: ["走私仓库", "临时据点", "火控节点", "黑市拍卖场"],
    破坏: ["中继塔", "采矿钻机", "追踪网络", "军火流水线"],
    营救: ["被困工程师", "欠债线人", "伤员小队", "劫持目标"],
    防御: ["边境诊所", "补给站", "临时营地", "净水设施"],
    占领: ["转运站", "通讯楼", "矿区闸门", "列车站台"],
    特殊: ["无名委托", "未知信号", "旧神经接口", "异常遗物"],
  };
  return randomItem(subjects[type.name] ?? ["未分类目标"]);
}

function createContractIntel() {
  return Object.fromEntries(contractIntelFields.map((field) => [field.key, randomItem(contractIntelPool[field.key])]));
}

function calculateInitialPowerRequirement(difficulty, reputation = 0) {
  const config = economyConfig.contracts.requirement;
  return (
    config.basePower +
    difficulty * randomNumber(config.powerPerDifficultyMin, config.powerPerDifficultyMax) +
    Math.floor(reputation / config.reputationStep) * config.reputationPressure +
    randomNumber(config.randomOffsetMin, config.randomOffsetMax)
  );
}

function createInitialContractReward(difficulty) {
  const config = economyConfig.contracts.reward;
  return {
    gold: config.baseGold + difficulty * randomNumber(config.goldPerDifficultyMin, config.goldPerDifficultyMax),
    reputation: Math.max(
      config.minReputation,
      difficulty * config.reputationPerDifficulty + randomNumber(config.reputationRandomMin, config.reputationRandomMax)
    ),
  };
}

function calculateInitialRefreshCost(difficulty) {
  const config = economyConfig.contracts.costs;
  return config.refreshBase + difficulty * config.refreshPerDifficulty;
}

function calculateInitialInvestigateCost({ rewardGold = 0, difficulty = 2 } = {}) {
  const config = economyConfig.contracts.costs;
  const fallbackReward =
    rewardGold > 0
      ? rewardGold
      : economyConfig.contracts.reward.baseGold + difficulty * economyConfig.contracts.reward.goldPerDifficultyMin;
  const rate = config.investigationRewardRateMin + Math.random() * (config.investigationRewardRateMax - config.investigationRewardRateMin);
  return Math.max(config.investigationMinCost, Math.round(fallbackReward * rate));
}

function createInitialRecommendedTeamSize(difficulty) {
  if (difficulty <= 1) return { min: 1, max: 2 };
  if (difficulty <= 3) return { min: 2, max: 3 };
  return { min: 3, max: 4 };
}

function createInitialContractRequirements(tags = []) {
  return {
    weaponTypes: drawInitialRequirements(contractRequirementPool.weaponTypes, randomNumber(1, 2)),
    damageTypes: drawInitialRequirements(contractRequirementPool.damageTypes, randomNumber(1, 2)),
    careerCategories: drawInitialRequirements(contractRequirementPool.careerCategories, randomNumber(1, 100) <= 35 ? 2 : 1),
    tags: tags.slice(0, 2),
  };
}

function drawInitialRequirements(pool, count) {
  const result = [];
  while (result.length < count && result.length < pool.length) {
    const item = randomItem(pool);
    if (!result.includes(item)) result.push(item);
  }
  return result;
}

function calculateRosterReputation(roster) {
  return roster
    .filter((character) => character.status !== "阵亡")
    .reduce((sum, character) => sum + Math.max(0, character.personalReputation ?? 0), 0);
}

function createCallsign() {
  return `${randomItem(shortEpithetAdjectives)}${randomItem(shortEpithetNouns)}`;
}

function createRandomName() {
  const profile = drawWeightedNameProfile();
  const given = randomItem(profile.given);
  if (profile.order === "single") return given;
  const surname = randomItem(profile.surnames);
  if (profile.order === "surname-first") return `${surname}${profile.joiner ?? ""}${given}`;
  return `${given}${profile.joiner ?? " "}${surname}`;
}

function drawWeightedNameProfile() {
  const total = nameProfiles.reduce((sum, profile) => sum + (profile.weight ?? 1), 0);
  let roll = randomNumber(1, total);
  for (const profile of nameProfiles) {
    roll -= profile.weight ?? 1;
    if (roll <= 0) return profile;
  }
  return nameProfiles[0];
}

function splitLegacyName(character) {
  if (character.callsign || typeof character.name !== "string" || !character.name.includes(" · ")) return;
  const [name, ...callsignParts] = character.name.split(" · ");
  character.name = name.trim();
  character.callsign = callsignParts.join(" · ").trim() || createCallsign();
}

function normalizeAvatar(character, usedKeys) {
  const initial = getNameInitial(character.name);
  const currentIndex = Number.isInteger(character.avatar?.paletteIndex) ? character.avatar.paletteIndex : null;
  if (currentIndex !== null) {
    const key = `${initial}-${currentIndex}`;
    const palette = avatarPalettes[currentIndex % avatarPalettes.length];
    if (!usedKeys.has(key)) {
      usedKeys.add(key);
      return { initial, paletteIndex: currentIndex, ...palette };
    }
  }
  return createUniqueAvatar(character, usedKeys);
}

function createUniqueAvatar(character, usedKeys = new Set()) {
  const initial = getNameInitial(character.name);
  const seed = hashString(`${character.id ?? ""}-${character.name ?? ""}`);
  for (let offset = 0; offset < avatarPalettes.length * 4; offset += 1) {
    const paletteIndex = (seed + offset) % avatarPalettes.length;
    const key = `${initial}-${paletteIndex}`;
    if (!usedKeys.has(key)) {
      usedKeys.add(key);
      return { initial, paletteIndex, ...avatarPalettes[paletteIndex] };
    }
  }

  const paletteIndex = (seed + usedKeys.size) % avatarPalettes.length;
  usedKeys.add(`${initial}-${paletteIndex}-${character.id}`);
  return { initial, paletteIndex, ...avatarPalettes[paletteIndex] };
}

function getNameInitial(name = "?") {
  const compact = String(name).trim().replace(/\s+/g, "");
  return compact.slice(0, 1) || "?";
}

function hashString(value) {
  return [...String(value)].reduce((hash, char) => (hash * 31 + char.charCodeAt(0)) >>> 0, 7);
}

function upgradeMissionToContract(mission) {
  if (mission.issuer && mission.type && mission.intel && mission.hidden) return mission;

  const fallbackTemplate = missionTemplates.find((template) => template.name === mission.name) ?? randomItem(missionTemplates);
  const fallbackTags = mission.tags ?? fallbackTemplate.tags;
  const fallbackType = contractTypes.find((type) => type.tags.some((tag) => fallbackTags.includes(tag))) ?? randomItem(contractTypes);
  mission.issuer ??= randomIssuer();
  mission.type ??= fallbackType.name;
  mission.typeCode ??= fallbackType.code;
  mission.actionType ??= fallbackType.actionType ?? "logistics";
  mission.acquisition ??= "旧合同转录";
  mission.description ??= `${randomItem(fallbackType.verbs)}目标。${randomItem(contractBriefFragments)}`;
  mission.intel ??= createContractIntel();
  mission.revealedIntel ??= [];
  mission.hidden ??= { twist: randomContractHiddenTwist() };
  const difficulty = mission.difficulty ?? fallbackTemplate.difficulty ?? 2;
  mission.refreshCost ??= calculateInitialRefreshCost(difficulty);
  mission.investigateCost ??= calculateInitialInvestigateCost({ rewardGold: mission.reward?.gold, difficulty });
  mission.issueDay ??= 1;
  mission.expiresDay ??= mission.issueDay + 4;
  return mission;
}

function randomContractHiddenTwist() {
  const weights = economyConfig.contracts.hiddenTwists.weights ?? {};
  const weighted = contractHiddenTwists.map((twist) => ({
    twist,
    weight: Math.max(0, weights[twist] ?? 1),
  }));
  const total = weighted.reduce((sum, item) => sum + item.weight, 0);
  if (total <= 0) return randomItem(contractHiddenTwists);
  let roll = Math.random() * total;
  for (const item of weighted) {
    roll -= item.weight;
    if (roll <= 0) return item.twist;
  }
  return weighted[weighted.length - 1]?.twist ?? randomItem(contractHiddenTwists);
}

const weaponTypes = ["步枪", "霰弹", "手枪", "狙击", "近战", "爆破", "医疗器械", "电子战"];

function generateWeapon(options = {}) {
  const rarity = options.rarity ?? rollRarity();
  const type = options.type ?? randomItem(weaponTypes);
  const powerRange = getRankPowerRange(rarity);
  return {
    id: createId(),
    name: `${rarity}级 ${type}`,
    rarity,

    slot: "weapon",
    power: options.power ?? randomNumber(...powerRange),

    itemCategory: "weapon",

function getRankPowerRange(rarity) {
  const reference =
    economyConfig.blackMarket.weaponPowerReferenceByRank?.[rarity] ??
    economyConfig.blackMarket.weaponPowerReferenceByRank?.F ??
    22;
  const min = Math.max(1, Math.round(reference * economyConfig.blackMarket.weaponPowerMultiplierMin));
  const max = Math.max(min, Math.round(reference * economyConfig.blackMarket.weaponPowerMultiplierMax));
  return [min, max];
}

}

  if (roll <= 24) return "B";
  if (roll <= 48) return "C";
  if (roll <= 70) return "D";
  if (roll <= 88) return "E";
