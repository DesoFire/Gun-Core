// ===== modules/character.js =====
function getCharacters() {
  return getState().roster;
}

function getRecruitPool() {
  return getState().recruitPool;
}

function getCharacter(id) {
  return getState().roster.find((character) => character.id === id);
}

function getCharacterClasses() {
  return characterClasses;
}

function hasPlayerCharacter() {
  return getState().roster.some((character) => character.isPlayer);
}

function createMercenary(classId = randomItem(Object.keys(characterClasses)), isPlayer = false, customName = "") {
  const resolvedClassId = characterClasses[classId] ? classId : randomItem(Object.keys(characterClasses));
  const baseClass = characterClasses[resolvedClassId];
  const category = careerCategories[baseClass.category];
  const maxHp = baseClass.maxHp + randomNumber(-2, 3);
  return {
    id: createId(),
    name: customName || createRandomName(),
    callsign: createCallsign(),
    classId: resolvedClassId,
    className: baseClass.name,
    careerCategory: baseClass.category,
    careerCategoryName: category?.name ?? "未分类",
    level: 0,
    xp: 0,
    hp: maxHp,
    maxHp,
    personalReputation: isPlayer ? 3 : randomNumber(0, 2),
    rank: "无",
    dossier: createDossier(),
    contractRecord: { completed: 0, failed: 0, survived: 0 },
    bounty: randomNumber(0, 24) * 10,
    debt: randomNumber(0, 18) * 5,
    signingMultiplier: randomNumber(economyConfig.recruitment.signingMultiplierMin, economyConfig.recruitment.signingMultiplierMax),
    stress: randomNumber(0, 8),
    wound: 0,
    isPlayer,
    tags: [...new Set([...(category?.tags ?? []), ...baseClass.tags])],
    equipment: createEmptyEquipment(),
    combatPower: baseClass.baseCombatPower + (category?.effects?.combatPowerBonus ?? 0) + randomNumber(-3, 4),
    status: "待命",
  };
}

function createCharacter(data) {
  const character = createMercenary(data.classId, Boolean(data.isPlayer), data.name);
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    draft.roster.unshift(character);
    normalizeCharacterAvatars(draft);
    draft.log.push(`第 ${draft.day} 天：${character.name} 成为了你的代表角色。`);
  });
  return character;
}

function updateCharacter(id, data) {
  updateState((draft) => {
    const character = draft.roster.find((item) => item.id === id);
    if (character) {
      if (typeof data.name === "string") data.name = data.name.trim().slice(0, 32);
      if (typeof data.callsign === "string") data.callsign = data.callsign.trim().slice(0, 24);
      Object.assign(character, data);
    }
  });
}

function hireRecruit(id) {
  let hired = null;
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const recruit = draft.recruitPool.find((character) => character.id === id);
    if (!recruit) return;
    if (getLivingMercenaryCount(draft) >= getMercenaryLimit(draft)) return;
    const cost = recruitCost(recruit);
    if (draft.gold < cost) return;

    draft.gold -= cost;
    draft.roster.push(recruit);
    draft.recruitPool = draft.recruitPool.filter((character) => character.id !== id);
    normalizeCharacterAvatars(draft);
    draft.log.push(`第 ${draft.day} 天：${recruit.name} 加入了事务所。`);
    hired = recruit;
  });
  return hired;
}

function refreshRecruits() {
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const cost = economyConfig.recruitment.refreshCost;
    if (draft.gold < cost) return;
    const poolSize = 2 + (draft.buildings.tavern ?? 0);
    draft.gold -= cost;
    draft.recruitPool = Array.from({ length: poolSize }, () => createMercenary());
    normalizeCharacterAvatars(draft);
    draft.log.push(`第 ${draft.day} 天：酒馆送来了一批新的候选人。`);
  });
}

function equipItem(characterId, slot, itemId) {
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const character = draft.roster.find((item) => item.id === characterId);
    const item = draft.inventory.find((entry) => entry.id === itemId);
    if (!character || !item || !canEquipItemToSlot(item, slot) || !canCharacterUseSlot(character, slot)) return;

    const previousItem = character.equipment[slot];
    if (previousItem) draft.inventory.push(previousItem);
    character.equipment[slot] = item;
    draft.inventory = draft.inventory.filter((entry) => entry.id !== itemId);
    draft.log.push(`第 ${draft.day} 天：${character.name} 装备了 ${item.name}。`);
  });
}

function unequipItem(characterId, slot) {
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const character = draft.roster.find((item) => item.id === characterId);
    if (!character || !character.equipment[slot]) return;
    const item = character.equipment[slot];
    character.equipment[slot] = null;
    draft.inventory.push(item);
    draft.log.push(`第 ${draft.day} 天：${character.name} 卸下了 ${item.name}。`);
  });
}

function canEquipItemToSlot(item, slot) {
  if (slot === "weapon") return item.itemCategory === "weapon" || item.slot === "weapon";
  if (slot === "armor") return item.itemCategory === "armor" || item.slot === "armor";
  return false;
}

function spendEnhancementPoint(characterId) {
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const character = draft.roster.find((item) => item.id === characterId);
    if (!character || character.status === "阵亡" || (draft.enhancementPoints ?? 0) <= 0) return;

    draft.enhancementPoints -= 1;
    const gain = getPromotionCombatPowerGain(character.rank);
    character.combatPower = (character.combatPower ?? 0) + gain;
    const condition = drawPositiveCondition(character, "enhancement");
    if (condition) {
      character.positiveConditions ??= [];
      character.positiveConditions.push(condition);
    }
    const conditionText = condition ? `，获得正面状态「${condition.name}」` : "";
    draft.log.push(`第 ${draft.day} 天：${character.name} 消耗 1 点强化点，战斗力 +${gain}${conditionText}。`);
  });
}

function eraseMercenaryReputation(characterId) {
  let result = { ok: false, cost: 0 };
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const character = draft.roster.find((item) => item.id === characterId);
    if (!character || character.status === "阵亡") return;
    const reputation = Math.max(0, character.personalReputation ?? 0);
    const cost = reputation * economyConfig.secrecy.eraseMercenaryReputationCostPerPoint;
    result = { ok: false, cost };
    if (reputation <= 0 || draft.gold < cost) return;
    draft.gold -= cost;
    character.personalReputation = 0;
    if (draft.unpaidSecrecy?.mercenaries) delete draft.unpaidSecrecy.mercenaries[character.id];
    draft.log.push(`第 ${draft.day} 天：支付 ${cost} 金抹去了 ${character.name} 的黑历史。`);
    result = { ok: true, cost };
  });
  return result;
}

function dismissMercenary(characterId) {
  let dismissed = null;
  updateState((draft) => {
    if (draft.gameStatus !== "active") return;
    const character = draft.roster.find((item) => item.id === characterId);
    if (!character || character.isPlayer || character.status !== "待命") return;

    Object.values(character.equipment ?? {})
      .filter(Boolean)
      .forEach((item) => draft.inventory.push(item));
    if (draft.unpaidSecrecy?.mercenaries) delete draft.unpaidSecrecy.mercenaries[character.id];
    draft.roster = draft.roster.filter((item) => item.id !== characterId);
    draft.log.push(`第 ${draft.day} 天：${character.name} 被解雇，装备已收回仓库。`);
    dismissed = character;
  });
  return dismissed;
}

function canCharacterUseSlot(character, slot) {
  if (slot !== "weapon") return true;
  const limbs = new Set((character.conditions ?? []).map((condition) => condition.limb).filter(Boolean));
  return !(limbs.has("leftArm") && limbs.has("rightArm"));
}

function recruitCost(character) {
  const config = economyConfig.recruitment;
  const multiplier = character.signingMultiplier ?? config.signingMultiplierMin;
  return Math.max(1, identityFee(character) * multiplier);
}

function getMercenaryLimit(state = getState()) {
  const barracksLevel = state.buildings?.barracks ?? 0;
  return (
    economyConfig.facilities.baseMercenaryLimit +
    barracksLevel * economyConfig.facilities.barracksMercenaryLimitPerLevel
  );
}

function getLivingMercenaryCount(state = getState()) {
  return (state.roster ?? []).filter((character) => character.status !== "阵亡").length;
}

function getEquipmentSlots() {
  return equipmentSlots;
}

function normalizeCharacter(character) {
  if (character.personalReputation == null && character.notoriety != null) character.personalReputation = character.notoriety;
  delete character.notoriety;
  character.personalReputation ??= character.isPlayer ? 3 : 1;
  character.rank = normalizeRank(character);
  character.level = Math.max(0, mercenaryRanks.indexOf(character.rank));
  character.xp ??= 0;
  delete character.traits;
  character.positiveConditions ??= [];
  character.dossier ??= createDossier();
  character.dossier.personality ??= randomItem(personalities);
  character.contractRecord ??= { completed: 0, failed: 0, survived: 0 };
  character.bounty ??= randomNumber(0, 24) * 10;
  character.debt ??= randomNumber(0, 18) * 5;
  character.signingMultiplier ??= randomNumber(economyConfig.recruitment.signingMultiplierMin, economyConfig.recruitment.signingMultiplierMax);
  character.wound ??= 0;
  character.stress ??= 0;
  character.status ??= "待命";
  character.tags ??= [];
  const baseClass = characterClasses[character.classId] ?? characterClasses.assault;
  const category = careerCategories[baseClass.category];
  character.classId = characterClasses[character.classId] ? character.classId : "assault";
  character.className = baseClass.name;
  character.careerCategory = baseClass.category;
  character.careerCategoryName = category?.name ?? "未分类";
  character.combatPower ??= baseClass.baseCombatPower + (category?.effects?.combatPowerBonus ?? 0);
  character.maxHp ??= baseClass.maxHp ?? 24;
  character.hp ??= Math.max(1, character.maxHp - character.wound * 4);
  character.equipment = { ...createEmptyEquipment(), ...(character.equipment ?? {}) };
  character.equipment = normalizeEquipmentSlots(character.equipment);
  return character;
}

function drawPositiveCondition(character, source = "growth") {
  const owned = new Set((character.positiveConditions ?? []).map((condition) => condition.name));
  const pool = positiveConditions.filter((condition) => !owned.has(condition.name));
  const condition = randomItem(pool.length > 0 ? pool : positiveConditions);
  return condition ? { ...condition, id: createId(), source } : null;
}

function renderCharacterDossier(character) {
  const maintenanceRisk = identityFee(character) + character.debt + Math.floor(character.bounty / 20);
  return `
    <section class="dossier-section">
      <h3>附属身份档案</h3>
      <div class="field-list">
        <div class="field"><span>性别字段</span><strong>${character.dossier.gender}</strong></div>
        <div class="field"><span>年龄</span><strong>${character.dossier.age}</strong></div>
        <div class="field"><span>性格</span><strong>${character.dossier.personality}</strong></div>
        <div class="field"><span>出身</span><strong>${character.dossier.origin}</strong></div>
        <div class="field"><span>法理状态</span><strong>${character.isPlayer ? "被重点伪造" : "临时有效"}</strong></div>
      </div>
    </section>
    <section class="dossier-section">
      <h3>风险与资源状态</h3>
      <div class="field-list">
        <div class="field"><span>个人声望</span><strong>${character.personalReputation ?? 0}</strong></div>
        <div class="field"><span>身份费</span><strong>${identityFee(character)} 金/天</strong></div>
        <div class="field"><span>悬赏金额</span><strong>${character.bounty} 金</strong></div>
        <div class="field"><span>欠债</span><strong>${character.debt} 金</strong></div>
        <div class="field"><span>报废距离</span><strong>${maintenanceRisk}</strong></div>
      </div>
    </section>
    <section class="dossier-section wide">
      <h3>非必要心理噪声数据</h3>
      <p class="muted">官方定义：不影响结算。实际用途：让错误的任务看起来像命运。</p>
      <div class="field-list">
        <div class="field"><span>恐惧</span><strong>${character.dossier.fear}</strong></div>
        <div class="field"><span>信条</span><strong>${character.dossier.creed}</strong></div>
        <div class="field"><span>遗言草稿</span><strong>${character.dossier.lastWords}</strong></div>
      </div>
    </section>
  `;
}

function createDossier() {
  return {
    gender: randomItem(genders),
    age: randomNumber(19, 48),
    origin: randomItem(origins),
    personality: randomItem(personalities),
    fear: randomItem(fears),
    creed: randomItem(creeds),
    lastWords: randomItem(lastWords),
  };
}

function createEmptyEquipment() {
  return Object.fromEntries(Object.keys(equipmentSlots).map((slot) => [slot, null]));
}

function createCallsign() {
  return `${randomItem(shortEpithetAdjectives)}${randomItem(shortEpithetNouns)}`;
}

function createRandomName() {
  const profile = drawWeightedNameProfile();
  const given = randomItem(profile.given);
  if (profile.order === "single") return given;
  const surname = randomItem(profile.surnames);
  if (profile.order === "surname-first") return `${surname}${profile.joiner ?? ""}${given}`;
  return `${given}${profile.joiner ?? " "}${surname}`;
}

function drawWeightedNameProfile() {
  const total = nameProfiles.reduce((sum, profile) => sum + (profile.weight ?? 1), 0);
  let roll = randomNumber(1, total);
  for (const profile of nameProfiles) {
    roll -= profile.weight ?? 1;
    if (roll <= 0) return profile;
  }
  return nameProfiles[0];
}

function normalizeEquipmentSlots(equipment) {
  return {
    weapon: equipment.weapon ?? null,
    armor: equipment.armor ?? null,
  };
}

function normalizeRank(character) {
  if (mercenaryRanks.includes(character.rank)) return character.rank;
  if (typeof character.level === "number") return mercenaryRanks[Math.min(character.level, mercenaryRanks.length - 1)] ?? "无";
  return calculateRank(character);
}



// ===== js/notifications.js =====
function showToast(message, tone = "warning") {
  let container = document.querySelector("#toast-stack");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-stack";
    container.className = "toast-stack";
    document.body.append(container);
  }
  const toast = document.createElement("div");
  toast.className = `toast toast-${tone}`;
  toast.textContent = message;
  container.append(toast);
  window.setTimeout(() => toast.remove(), 3200);
}

function showInsufficientFunds(currentGold, cost) {
  showToast(`资金不足。当前 ${currentGold} 金，还差 ${Math.max(0, cost - currentGold)} 金。`, "bad");
}

function confirmResourceSpend(action, cost, resource = "金") {
  return window.confirm(`${action}\n需要花费 ${cost} ${resource}。是否确认？`);
}

function showSpendSuccess(action, cost, remainingGold) {
  const remainingText = Number.isFinite(remainingGold) ? `，剩余 ${remainingGold} 金` : "";
  showToast(`${action}成功，花费 ${cost} 金${remainingText}。`, "good");
}

function showSpendFailure(action, reason = "条件不满足或资源不足。") {
  showToast(`${action}失败：${reason}`, "bad");
}



// ===== ui/mercenaryAvatarUI.js =====
function renderMercenaryAvatar(character, options = {}) {
  const size = options.size ?? "medium";
  const avatar = character.avatar ?? {};
  const initial = avatar.initial ?? getNameInitial(character.name);
  const style = [
    `--avatar-bg:${avatar.bg ?? "#2f4658"}`,
    `--avatar-fg:${avatar.fg ?? "#f4efe4"}`,
    `--avatar-ring:${avatar.ring ?? "#8bb7c9"}`,
  ].join(";");

  return `
    <span class="merc-avatar merc-avatar-${size}" style="${style}" title="${character.name}" aria-label="${character.name}">
      <span>${initial}</span>
    </span>
  `;
}

function getNameInitial(name = "?") {
  const compact = String(name).trim().replace(/\s+/g, "");
  return compact.slice(0, 1) || "?";
}



// ===== ui/characterUI.js =====
let requestRender = () => {};
let openDossierCharacterId = null;
let activeDossierTab = "attributes";
let selectedEquipmentSlot = "weapon";

function initCharacterUI({ onRenderNeeded }) {
  requestRender = onRenderNeeded;

  document.querySelector("#refresh-recruits").addEventListener("click", handleRefreshRecruits);
}

function renderCharacterUI() {

function renderRoster() {
  const container = document.querySelector("#roster-list");
  const roster = getCharacters();
  if (roster.length === 0) {
    container.innerHTML = `<p class="muted">还没有佣兵。先去招募或创建玩家角色。</p>`;

function renderCharacterCard(character, options = {}) {
  const isDispatch = options.mode === "dispatch";

  const rankLabel = formatRank(character.rank);
  const combatPower = calculateCharacterCombatPower(character);
  const weaponPower = character.equipment?.weapon?.power ?? 0;
  return `
    <article class="card character-card ${isDispatch ? "dispatch-character-card" : ""} ${selected ? "selected" : ""}" data-open-character="${character.id}">
      <div class="card-header">
        <div class="identity-line">

            <p class="card-title">${character.name}</p>

          </div>
        </div>
        ${
          isDispatch
            ? `<button class="${selected ? "ghost-button" : "primary-button"} dispatch-join-button" data-toggle-dispatch-member="${character.id}" type="button">${selected ? "移出" : "加入"}</button>`
            : `<span class="badge">${character.status}</span>`
        }

      ${renderCharacterTagRow(character)}
      <div class="character-kpi-grid">
        <div class="character-kpi primary"><span>总战力</span><strong>${combatPower}</strong><small>基础 ${character.combatPower ?? 0} / 武器 +${weaponPower}</small></div>

        <div class="character-kpi ${character.wound > 0 ? "danger" : ""}"><span>伤势</span><strong>${character.wound}</strong></div>

        <span>个人声望 ${character.personalReputation ?? 0}</span>
        <span>正面 ${getPositiveStatusCount(character)}</span>
        <span>负面 ${character.conditions?.length ?? 0}</span>
      </div>
      ${
        isDispatch
          ? `<div class="button-row">
              <button class="link-button" data-open-dispatch-character="${character.id}" type="button">查看人物卡</button>
              <button class="link-button" data-equip-dispatch-character="${character.id}" type="button">更换装备</button>
            </div>`

      }

}

function renderRecruits() {
  const container = document.querySelector("#recruit-list");
  const state = getState();
  const livingCount = getLivingMercenaryCount(state);
  const mercenaryLimit = getMercenaryLimit(state);
  const isFull = livingCount >= mercenaryLimit;
  container.innerHTML = getRecruitPool()
    .map((character) => {
      const cost = recruitCost(character);
      const combatPower = calculateCharacterCombatPower(character);
      const disabled = state.gameStatus !== "active" || isFull ? "disabled" : "";
      return `
        <article class="card recruit-card">
          <div class="card-header">
            <div class="identity-line">
              ${renderMercenaryAvatar(character)}
              <div>
                <p class="card-title">${character.name}</p>
                <p class="muted">${character.careerCategoryName ?? "未分类"} / ${character.className}</p>
              </div>
            </div>
            <button class="primary-button" data-recruit="${character.id}" ${disabled} type="button">招募 ${cost} 金</button>
          </div>
          <div class="character-kpi-grid recruit-kpis">
            <div class="character-kpi primary"><span>战力</span><strong>${combatPower}</strong></div>
            <div class="character-kpi"><span>个人声望</span><strong>${character.personalReputation ?? 0}</strong></div>
            <div class="character-kpi"><span>日薪</span><strong>${identityFee(character)}/天</strong></div>
            <div class="character-kpi cost"><span>雇佣费</span><strong>${cost}</strong></div>
          </div>
          ${renderCharacterTagRow(character)}
          ${isFull ? `<p class="muted">佣兵上限 ${livingCount}/${mercenaryLimit}，升级兵营可提高上限。</p>` : ""}
        </article>
      `;
    })
    .join("");

  container.querySelectorAll("[data-recruit]").forEach((button) => {
    button.addEventListener("click", () => {
      const state = getState();
      const recruit = getRecruitPool().find((character) => character.id === button.dataset.recruit);
      const cost = recruit ? recruitCost(recruit) : 0;
      if (getLivingMercenaryCount(state) >= getMercenaryLimit(state)) {
        showToast(`佣兵上限已满：${getLivingMercenaryCount(state)}/${getMercenaryLimit(state)}。升级兵营可提高上限。`, "bad");
        return;
      }
      if (state.gold < cost) {
        showInsufficientFunds(state.gold, cost);
        return;
      }
      if (!confirmResourceSpend(`雇佣「${recruit.name}」`, cost)) return;
      const beforeGold = getState().gold;
      hireRecruit(button.dataset.recruit);
      const afterGold = getState().gold;
      if (afterGold >= beforeGold) {
        showSpendFailure("雇佣佣兵", "雇佣未完成。");
        return;
      }
      showSpendSuccess("雇佣佣兵", beforeGold - afterGold, afterGold);
    });
  });
}

function renderCharacterTagRow(character) {
  const tags = [
    { label: character.careerCategoryName ?? "未分类", className: "badge" },
    { label: character.className, className: "badge" },
    ...(character.positiveConditions ?? []).slice(0, 3).map((condition) => ({
      label: condition.name,
      className: `badge positive-condition-badge positive-condition-${condition.severity ?? "light"}`,
    })),
    ...(character.conditions ?? []).slice(0, 4).map((condition) => ({
      label: condition.name,
      className: `badge condition-badge condition-${condition.severity ?? "light"}`,
    })),
  ];
  const weapon = character.equipment?.weapon;
  const armor = character.equipment?.armor;
  if (weapon?.damageType) tags.push({ label: `武器：${weapon.damageType}`, className: "badge equipment-tag weapon-tag" });
  if (armor?.protectionType) tags.push({ label: `防具：${armor.protectionType}`, className: "badge equipment-tag armor-tag" });
  return `<div class="badge-row character-tag-row">${tags.map((tag) => `<span class="${tag.className}">${tag.label}</span>`).join("")}</div>`;
}

function handleRefreshRecruits() {
  const state = getState();
  const cost = getRecruitRefreshCost();
  if (state.gold < cost) {
    showInsufficientFunds(state.gold, cost);
    return;
  }
  if (!confirmResourceSpend("刷新招募名单", cost)) return;
  const beforeGold = state.gold;
  refreshRecruits();
  const afterGold = getState().gold;
  if (afterGold >= beforeGold) {
    showSpendFailure("刷新招募名单", "刷新未完成。");
    return;
  }
  showSpendSuccess("刷新招募名单", beforeGold - afterGold, afterGold);
}

function getRecruitRefreshCost() {
  return economyConfig.recruitment.refreshCost;
}

function openCharacterSheet(id, options = {}) {
  openDossierCharacterId = id;
  activeDossierTab = options.tab ?? "attributes";
  selectedEquipmentSlot = "weapon";
  renderCharacterSheet(id);
  document.querySelector("#mercenary-dialog").showModal();
}

function renderCharacterSheet(id) {
  const character = getCharacter(id);
  if (!character) return;
  const combatPower = calculateCharacterCombatPower(character);
  const assignedMission =
    character.status.startsWith("履行") || character.status.startsWith("执行") ? character.status : "无";

  const dossier = document.querySelector("#mercenary-dossier");
  dossier.innerHTML = `
    <div class="dossier-top">
      <div class="identity-line identity-line-large dossier-identity">
          ${renderMercenaryAvatar(character, { size: "large" })}
          <div>
            <div class="dossier-code">SSS-GUILD DOSSIER / FIELD SHEET</div>
            <button class="editable-title" data-edit-character-name="${character.id}" title="点击重命名" type="button">${character.name}</button>
            <button class="editable-callsign" data-edit-character-callsign="${character.id}" title="点击修改外号" type="button">外号：${character.callsign ?? "未登记"}</button>
            <div class="dossier-chip-row">
              ${renderCareerChip(character)}
              <span class="career-chip" title="具体职业决定初始战力、标签和职业加成。">${character.className}</span>
              ${renderStatusSwitch(character.status)}
            </div>
          </div>
        </div>
      <div class="dossier-head-stats">
        ${renderRankBadge(character.rank)}
        <div class="mini-stat"><span>战力</span><strong>${combatPower}</strong></div>
        <div class="mini-stat ${character.stress >= 60 ? "danger" : character.stress >= 30 ? "warning" : ""}"><span>压力</span><strong>${character.stress}</strong></div>
        <div class="mini-stat ${character.wound > 0 ? "danger" : ""}"><span>伤势</span><strong>${character.wound}</strong></div>
        <div class="mini-stat"><span>个人声望</span><strong>${character.personalReputation ?? 0}</strong></div>
      </div>
      <button class="ghost-button dialog-close-button" data-close-dossier aria-label="关闭" title="关闭" type="button">关闭</button>
    </div>
    <div class="subtabbar" aria-label="人物卡切换">
      <button class="subtab-button ${activeDossierTab === "attributes" ? "active" : ""}" data-dossier-tab="attributes" type="button">属性</button>
      <button class="subtab-button ${activeDossierTab === "archive" ? "active" : ""}" data-dossier-tab="archive" type="button">档案</button>
    </div>
    <div class="dossier-content">${renderActiveSheetTab(character)}</div>
  `;

  dossier.querySelector("[data-close-dossier]").addEventListener("click", () => {
    document.querySelector("#mercenary-dialog").close();
    openDossierCharacterId = null;
  });
  dossier.querySelectorAll("[data-dossier-tab]").forEach((button) => {
    button.addEventListener("click", () => {
      activeDossierTab = button.dataset.dossierTab;
      renderCharacterSheet(id);
    });
  });
  dossier.querySelectorAll("[data-spend-enhancement]").forEach((button) => {
    button.addEventListener("click", () => {
      if (!confirmResourceSpend("强化佣兵", 1, "强化点")) return;
      const before = getState();
      const targetBefore = getCharacter(button.dataset.spendEnhancement);
      const beforePower = targetBefore?.combatPower ?? 0;
      spendEnhancementPoint(button.dataset.spendEnhancement);
      const after = getState();
      const targetAfter = getCharacter(button.dataset.spendEnhancement);
      if ((after.enhancementPoints ?? 0) >= (before.enhancementPoints ?? 0) || (targetAfter?.combatPower ?? 0) <= beforePower) {
        showSpendFailure("强化佣兵", "强化点不足或目标不可用。");
        return;
      }
      showToast(`强化佣兵成功，消耗 1 强化点，剩余 ${after.enhancementPoints ?? 0}。`, "good");
    });
  });
  dossier.querySelectorAll("[data-edit-character-name]").forEach((button) => {
    button.addEventListener("click", () => editCharacterIdentity(button.dataset.editCharacterName, "name"));
  });
  dossier.querySelectorAll("[data-edit-character-callsign]").forEach((button) => {
    button.addEventListener("click", () => editCharacterIdentity(button.dataset.editCharacterCallsign, "callsign"));
  });
  dossier.querySelectorAll("[data-erase-reputation]").forEach((button) => {
    button.addEventListener("click", () => {
      const target = getCharacter(button.dataset.eraseReputation);
      const cost = (target?.personalReputation ?? 0) * economyConfig.secrecy.eraseMercenaryReputationCostPerPoint;
      if (getState().gold < cost) {
        showInsufficientFunds(getState().gold, cost);
        return;
      }
      if (!confirmResourceSpend(`抹去「${target?.name ?? "佣兵"}」的黑历史`, cost)) return;
      const beforeGold = getState().gold;
      eraseMercenaryReputation(button.dataset.eraseReputation);
      const afterGold = getState().gold;
      if (afterGold >= beforeGold) {
        showSpendFailure("抹去黑历史", "操作未完成。");
        return;
      }
      showSpendSuccess("抹去黑历史", beforeGold - afterGold, afterGold);
      renderCharacterSheet(id);
    });
  });
  dossier.querySelectorAll("[data-dismiss-mercenary]").forEach((button) => {
    button.addEventListener("click", () => {
      const target = getCharacter(button.dataset.dismissMercenary);
      if (!target) return;
      const confirmed = window.confirm(`确认解雇 ${target.name}？装备会回到仓库，但该佣兵会离开基地。`);
      if (!confirmed) return;
      dismissMercenary(button.dataset.dismissMercenary);
      document.querySelector("#mercenary-dialog").close();
      openDossierCharacterId = null;
    });
  });
  bindEquipmentEvents(id);
}

function renderActiveSheetTab(character) {
  if (activeDossierTab === "archive") return `<div class="dossier-grid">${renderCharacterDossier(character)}</div>`;
  return renderAttributesTab(character);
}

function editCharacterIdentity(characterId, field) {
  const character = getCharacter(characterId);
  if (!character) return;
  const label = field === "name" ? "姓名" : "外号";
  const currentValue = field === "name" ? character.name : character.callsign ?? "";
  const value = window.prompt(`修改${label}`, currentValue);
  if (value === null) return;
  const trimmed = value.trim();
  if (!trimmed) return;
  updateCharacter(characterId, { [field]: trimmed });
  renderCharacterSheet(characterId);
}

              </div>

function renderCareerChip(character) {
  const category = careerCategories[character.careerCategory];

  return `<span class="career-chip career-chip-primary" title="${title}">${character.careerCategoryName ?? "未分类"}</span>`;
}

function renderStatusSwitch(status) {
  const isReady = status === "待命";
  return `<span class="status-switch ${isReady ? "ready" : "busy"}" title="角色当前是否可被派遣"><i></i>${status}</span>`;

function renderRankBadge(rank) {
  const key = rank && rank !== "无" ? rank : "none";
  return `<div class="rank-badge rank-${key}"><span>评级</span><strong>${formatRank(rank)}</strong></div>`;
}

function getPositiveStatusCount(character) {
  return character.positiveConditions?.length ?? 0;
}

function renderConditionList(character) {
  const conditions = character.conditions ?? [];
  if (conditions.length === 0) return `<p class="muted">暂时没有被合同附赠人生体验。</p>`;
  return `
    <div class="trait-list">
      ${conditions
        .map(
          (condition) => `
            <article class="trait-item condition-item condition-${condition.severity ?? "light"}">
              <div>
                <strong>${condition.name}</strong>
                <p class="muted">${condition.description}</p>
              </div>
              <span class="badge condition-badge condition-${condition.severity ?? "light"}">${formatSeverity(condition.severity)} / -${condition.powerPenalty ?? 0} 战力</span>

          `
        )
        .join("")}
    </div>

}

function formatSeverity(severity) {
  if (severity === "heavy") return "重";
  if (severity === "medium") return "中";
  return "轻";
}

function renderEquipmentTab(character) {
  const slots = getEquipmentSlots();
  const candidates = getCandidateItems(selectedEquipmentSlot);
  const canAct = getState().gameStatus === "active";
  const slotLocked = isSlotLocked(character, selectedEquipmentSlot);
  return `
    <div class="body-equipment-layout">
      <section class="body-panel">
        <div class="simple-equipment-map" aria-label="人物装备槽">
          ${Object.entries(slots).map(([slot, label]) => renderBodySlot(character, slot, label)).join("")}

      <section class="dossier-section equipment-browser">
        <div class="card-header">
          <div>

          </div>
          <button class="ghost-button" data-unequip-slot="${selectedEquipmentSlot}" ${canAct && character.equipment[selectedEquipmentSlot] ? "" : "disabled"} type="button">卸下当前</button>
        </div>
        <div class="equipment-pool">${renderEquipmentCandidates(candidates, slotLocked)}</div>
      </section>
    </div>
  `;
}

function renderBodySlot(character, slot, label) {
  const equipped = character.equipment[slot];
  return `
    <button class="body-slot slot-${slot} ${selectedEquipmentSlot === slot ? "active" : ""}"
      data-select-slot="${slot}"
      data-drop-slot="${slot}"
      type="button">
      <span>${label}</span>
      <strong>${equipped ? equipped.name : "空"}</strong>
    </button>
  `;
}

function renderEquipmentCandidates(candidates, slotLocked = false) {
  const canAct = getState().gameStatus === "active";
  if (candidates.length === 0) return `<p class="muted">仓库中没有适合该槽位的装备。</p>`;
  return candidates
    .map(
      (item) => `
        <article class="equipment-item" draggable="true" data-drag-item="${item.id}">
          <div>
            <strong>${item.name}</strong>
            <p class="muted">${item.type} · ${getWeaponTagNames(item).join(" / ") || "无标签"} · ${item.note}</p>
            <p class="muted">${renderEquipmentSummary(item)}</p>
          </div>
          <button class="primary-button" data-equip-item="${item.id}" ${canAct && !slotLocked ? "" : "disabled"} type="button">装备</button>
        </article>
      `
    )
    .join("");
}

function getCandidateItems(slot) {
  return getInventory().filter((item) => canEquipItemToSlot(item, slot));
}

function bindEquipmentEvents(characterId) {
  if (activeDossierTab !== "attributes") return;
  const dossier = document.querySelector("#mercenary-dossier");

  dossier.querySelectorAll("[data-select-slot]").forEach((button) => {
    button.addEventListener("click", () => {
      selectedEquipmentSlot = button.dataset.selectSlot;
      renderCharacterSheet(characterId);
    });
    button.addEventListener("dragover", (event) => {
      event.preventDefault();
      button.classList.add("drag-over");
    });
    button.addEventListener("dragleave", () => button.classList.remove("drag-over"));
    button.addEventListener("drop", (event) => {
      event.preventDefault();
      button.classList.remove("drag-over");
      const itemId = event.dataTransfer.getData("text/plain");
      selectedEquipmentSlot = button.dataset.dropSlot;
      equipItem(characterId, selectedEquipmentSlot, itemId);
    });
  });

  dossier.querySelectorAll("[data-drag-item]").forEach((item) => {
    item.addEventListener("dragstart", (event) => {
      event.dataTransfer.setData("text/plain", item.dataset.dragItem);
      event.dataTransfer.effectAllowed = "move";
    });
  });

  dossier.querySelectorAll("[data-equip-item]").forEach((button) => {
    button.addEventListener("click", () => equipItem(characterId, selectedEquipmentSlot, button.dataset.equipItem));
  });
  dossier.querySelectorAll("[data-unequip-slot]").forEach((button) => {
    button.addEventListener("click", () => unequipItem(characterId, button.dataset.unequipSlot));
  });
}

function isSlotLocked(character, slot) {
  if (slot !== "weapon") return false;
  const limbs = new Set((character.conditions ?? []).map((condition) => condition.limb).filter(Boolean));
  return limbs.has("leftArm") && limbs.has("rightArm");
}

function renderEquipmentSummary(item) {
  if (item.itemCategory === "weapon") return `等级 ${item.rarity} · 战斗力 +${item.power ?? 0} · 伤害 ${item.damageType ?? "未知"}`;
  if (item.itemCategory === "armor") return `等级 ${item.rarity} · 死亡率 -${item.deathRiskReduction ?? 0}% · 防护 ${item.protectionType ?? "未知"}`;
  return "未分类装备";
}

function formatRank(rank) {
  return rank === "无" ? "无等级" : `${rank} 级佣兵`;
}

function formatCareerRequirements(categories = []) {
  if (categories.length === 0) return "鏈槑";
  return categories.map((category) => careerCategories[category]?.name ?? category).join(" + ");
}

function getLockedIntelFields(mission) {
  const revealed = mission.revealedIntel ?? [];
  return contractIntelFields.filter((field) => !revealed.includes(field.key));
}

function isIntelRevealed(mission, key) {
  return (mission.revealedIntel ?? []).includes(key);
}

function renderContractSummaryIntel(mission) {
  const chips = [];
  if (isIntelRevealed(mission, "damageTypes")) chips.push(`鏁屼激 ${formatRequirementValue(mission, "damageTypes")}`);
  if (isIntelRevealed(mission, "careerCategories")) chips.push(`鑱屼笟 ${formatRequirementValue(mission, "careerCategories")}`);
  if (isIntelRevealed(mission, "weaponTypes")) chips.push(`姝﹀櫒 ${formatRequirementValue(mission, "weaponTypes")}`);
  if (isIntelRevealed(mission, "teamSize")) chips.push(`浜烘暟 ${formatRequirementValue(mission, "teamSize")}`);
  if (chips.length === 0) return "";
  return `<div class="contract-intel-chips">${chips.map((chip) => `<span>${chip}</span>`).join("")}</div>`;
}

function renderIntelAction(mission, field, canAct) {
  const revealed = isIntelRevealed(mission, field.key);
  return `
    <article class="intel-action ${revealed ? "revealed" : ""}">
      <div>
        <strong>${field.label}</strong>
        <p class="muted">${revealed ? formatRequirementValue(mission, field.key) : getIntelHint(field.key)}</p>
      </div>
      <button class="ghost-button" data-investigate-contract="${mission.id}" data-intel-key="${field.key}" ${canAct && !revealed ? "" : "disabled"} type="button">${revealed ? "宸茶幏鍙? : `璋冩煡 ${formatInvestigationCost(mission, "targeted")}`}</button>
    </article>
  `;
}

function renderDifficultyBadge(difficulty = 1) {
  const ranks = ["F", "F", "E", "D", "C", "B", "A", "S"];
  const rank = ranks[Math.max(0, Math.min(ranks.length - 1, difficulty))] ?? "F";
  return `<span class="rank-pill rank-${rank}">${rank}</span>`;
}

function formatRequirementValue(mission, key) {
  if (key === "damageTypes") return mission.requirements?.damageTypes?.join(" / ") || "鏈槑";
  if (key === "careerCategories") return formatCareerRequirements(mission.requirements?.careerCategories);
  if (key === "weaponTypes") return mission.requirements?.weaponTypes?.join(" / ") || "鏈槑";
  if (key === "teamSize") return `${mission.recommendedTeamSize?.min ?? 1}-${mission.recommendedTeamSize?.max ?? 4} 浜篳;
  return mission.intel?.[key] ?? "鏈槑";
}

  const facilityDiscount = (getState().buildings?.intel ?? 0) * economyConfig.facilities.intelInvestigationDiscountPerLevel;

  return `${Math.max(1, Math.round(base * multiplier * (1 - discount)))} 閲慲;
}

function bindContractEvents(mission) {
  const dossier = document.querySelector("#contract-dossier");
  dossier.querySelector("[data-close-contract]").addEventListener("click", () => {
    document.querySelector("#contract-dialog").close();
    openContractId = null;
    dispatchMissionId = null;
    dispatchSelection.clear();
  });

  dossier.querySelectorAll("[data-open-dispatch]").forEach((button) => {
    button.addEventListener("click", () => {
      dispatchMissionId = dispatchMissionId === button.dataset.openDispatch ? null : button.dataset.openDispatch;
      if (!dispatchMissionId) dispatchSelection.clear();
      renderContractCard(mission.id);
    });
  });

  dossier.querySelectorAll("[data-investigate-contract]").forEach((button) => {
    button.addEventListener("click", () => {
      const state = getState();
      const cost = extractCost(button.textContent) || mission.investigateCost ?? 0;
      if (state.gold < cost) {
        showInsufficientFunds(state.gold, cost);
        return;
      }
      if (!confirmResourceSpend(`Investigate contract: ${mission.name}`, cost)) return;
      const beforeGold = getState().gold;
      investigateMission(button.dataset.investigateContract, button.dataset.intelKey ?? "random");
      const afterGold = getState().gold;
      if (afterGold >= beforeGold) {
        showSpendFailure("Investigate contract", "Investigation was not completed.");
        return;
      }
      showSpendSuccess("Investigate contract", beforeGold - afterGold, afterGold);
      renderContractCard(mission.id);
    });
  });

  dossier.querySelectorAll("[data-toggle-dispatch-member]").forEach((button) => {
    button.addEventListener("click", () => {
      toggleDispatchMember(button.dataset.toggleDispatchMember);
      renderContractCard(mission.id);
    });
  });

  dossier.querySelectorAll("[data-open-dispatch-character]").forEach((button) => {
    button.addEventListener("click", () => openCharacterSheet(button.dataset.openDispatchCharacter));
  });

  dossier.querySelectorAll("[data-equip-dispatch-character]").forEach((button) => {
    button.addEventListener("click", () => openCharacterSheet(button.dataset.equipDispatchCharacter, { tab: "equipment" }));
  });

  dossier.querySelectorAll("[data-confirm-dispatch]").forEach((button) => {
    button.addEventListener("click", () => {
      const selectedIds = [...dispatchSelection];
      startMission(button.dataset.confirmDispatch, selectedIds);
      dispatchMissionId = null;
      dispatchSelection.clear();
      document.querySelector("#contract-dialog").close();
      openContractId = null;
    });
  });
}

function toggleDispatchMember(id) {
  if (dispatchSelection.has(id)) {
    dispatchSelection.delete(id);
    return;
  }
  if (dispatchSelection.size >= 4) return;
  dispatchSelection.add(id);
}

function extractCost(text = "") {
  const match = String(text).match(/(\d+)/);
  return match ? Number(match[1]) : 0;
}

function getMissionMembers(mission, roster) {
  return mission.assigned.map((memberId) => roster.find((character) => character.id === memberId)).filter(Boolean);
}

function initDialogStatusContext() {
  const observer = new MutationObserver(syncGlobalStatusContext);
  document.querySelectorAll("dialog").forEach((dialog) => {
    observer.observe(dialog, { attributes: true, attributeFilter: ["open"] });
  });
  syncGlobalStatusContext();
}

function closeGlobalStatusDrawer() {
  document.querySelector("#global-status-drawer")?.classList.remove("open");
  const panel = document.querySelector("#global-status-panel");
  if (panel) panel.hidden = true;
}

function syncGlobalStatusContext() {
  const drawer = document.querySelector("#global-status-drawer");
  if (!drawer) return;
  const activeDialog = [...document.querySelectorAll("dialog[open]")].find((dialog) => dialog.id !== "intro-dialog");
  drawer.classList.toggle("in-dialog", Boolean(activeDialog));
  if (activeDialog) {
    activeDialog.append(drawer);
    drawer.style.left = "";
    drawer.style.top = "";
    drawer.style.right = "";
    return;
  }
  document.querySelector("#root")?.append(drawer);
  drawer.classList.remove("in-dialog");
  const savedPosition = loadDrawerPosition();
  if (savedPosition) {
    drawer.style.left = `${savedPosition.left}px`;
    drawer.style.top = `${savedPosition.top}px`;
    drawer.style.right = "auto";
  } else {
    drawer.style.left = "";
    drawer.style.top = "";
    drawer.style.right = "";
  }
}

function showIntroIfNeeded() {
  const state = getState();
  if (state.introSeen) return;
  const dialog = document.querySelector("#intro-dialog");
  if (!dialog || dialog.open) return;
  try {
    if (typeof dialog.showModal === "function") {
      dialog.showModal();
    } else {
      dialog.setAttribute("open", "");
    }
  } catch (error) {
    console.warn("Intro dialog could not be opened.", error);
  }
}

function closeIntro() {
  updateState((draft) => {

}

function initGlobalStatusDrawer() {
  const drawer = document.querySelector("#global-status-drawer");
  const toggle = document.querySelector("#global-status-toggle");
  const panel = document.querySelector("#global-status-panel");
  const savedPosition = loadDrawerPosition();
  if (savedPosition) {
    drawer.style.left = `${savedPosition.left}px`;
    drawer.style.top = `${savedPosition.top}px`;
    drawer.style.right = "auto";
  }

  let drag = null;
  toggle.addEventListener("pointerdown", (event) => {
    if (drawer.classList.contains("in-dialog")) return;
    drag = {
      pointerId: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      left: drawer.offsetLeft,
      top: drawer.offsetTop,
      moved: false,
    };
    toggle.setPointerCapture(event.pointerId);
    drawer.classList.add("dragging");
  });
  toggle.addEventListener("pointermove", (event) => {
    if (!drag || drag.pointerId !== event.pointerId) return;
    const dx = event.clientX - drag.startX;
    const dy = event.clientY - drag.startY;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    const maxLeft = window.innerWidth - drawer.offsetWidth - 8;
    const maxTop = window.innerHeight - toggle.offsetHeight - 8;
    const left = Math.max(8, Math.min(maxLeft, drag.left + dx));
    const top = Math.max(8, Math.min(maxTop, drag.top + dy));
    drawer.style.left = `${left}px`;
    drawer.style.top = `${top}px`;
    drawer.style.right = "auto";
  });
  toggle.addEventListener("pointerup", (event) => {
    const dialogMode = drawer.classList.contains("in-dialog");
    if (dialogMode) {
      drawer.classList.toggle("open");
      panel.hidden = !drawer.classList.contains("open");
      return;
    }
    if (!drag || drag.pointerId !== event.pointerId) return;
    toggle.releasePointerCapture(event.pointerId);
    drawer.classList.remove("dragging");
    saveDrawerPosition(drawer);
    const shouldToggle = !drag.moved;
    drag = null;
    if (!shouldToggle) return;
    drawer.classList.toggle("open");
    panel.hidden = !drawer.classList.contains("open");
  });
  toggle.addEventListener("pointercancel", () => {
    drag = null;
    drawer.classList.remove("dragging");
  });
}

function loadDrawerPosition() {
  try {
    return JSON.parse(localStorage.getItem("gun-core-status-drawer-position") ?? "null");
  } catch {
    return null;
  }
}

function saveDrawerPosition(drawer) {
  localStorage.setItem(
    "gun-core-status-drawer-position",
    JSON.stringify({ left: drawer.offsetLeft, top: drawer.offsetTop })
  );
}

function renderCalendar() {
  const state = getState();
  const startDay = Math.max(1, state.day - 2);
  const days = Array.from({ length: 7 }, (_, index) => startDay + index);
  const activeMissions = state.missions.filter((mission) => mission.status === "active");
  const availableMissions = state.missions.filter((mission) => mission.status === "available");

  document.querySelector("#calendar-list").innerHTML = days
    .map((day) => {
      const entries = [
        ...state.timeline.filter((entry) => isEntryOnDay(entry, day)),
        ...activeMissions
          .filter((mission) => !state.timeline.some((entry) => entry.missionId === mission.id))
          .filter((mission) => day >= (mission.startDay ?? state.day) && day <= (mission.endDay ?? state.day + mission.remaining))
          .map((mission) => ({
            type: "contract",
            status: "active",
            title: mission.name,
            detail: `鎵ц涓紝棰勮绗?${mission.endDay} 澶╃粨鏉焋,
          })),
        ...availableMissions
          .filter((mission) => mission.expiresDay === day)
          .map((mission) => ({
            type: "contract",
            status: "planned",
            title: mission.name,
            detail: "濂戠害鎴鏃?,
          })),
      ];
      return `
        <article class="calendar-day ${day === state.day ? "today" : ""}">
          <div class="calendar-day-head">
            <strong>绗?${day} 澶?/strong>
            <span>${day < state.day ? "宸茬粨鏉? : day === state.day ? "浠婂ぉ" : "璁″垝"}</span>
          </div>
          <div class="calendar-events">
            ${
              entries.length > 0
                ? entries.map(renderCalendarEntry).join("")
                : `<p class="muted">鏆傛棤琛屽姩</p>`
            }
          </div>
        </article>
      `;
    })
    .join("");
}

function isEntryOnDay(entry, day) {
  const start = entry.day ?? day;
  const end = entry.endDay ?? start;
  return day >= start && day <= end;
}

}

          ? `${level} 搴?路 闃插尽鎴樺姏 +${level * economyConfig.facilities.defensePowerPerLevel}`
          : "鏈慨寤?
        : isUnlocked
          ? `${rank}绾?路 缁存姢璐?${building.upkeep * level}/澶ー
          : "鏈В閿?;
      const badgeText = isStackedDefense ? `${level} 搴 : isUnlocked ? rank : "鏈В閿?;
      return `
        <article class="card facility-card ${isUnlocked ? "" : "locked"}" data-open-facility="${id}">
          <div class="card-header">
            <div>
              <p class="card-title">${building.name}</p>
              <p class="muted">${statusText}</p>
            </div>
            <span class="badge">${badgeText}</span>
          </div>
          <p class="muted">${building.description}</p>
          ${
            isStackedDefense
              ? `<p class="muted">缁х画淇缓锛?${economyConfig.facilities.defensePowerPerLevel} 闃插尽鎴樺姏 路 璐圭敤 ${cost} 閲?/p>`
              : level < 7
                ? `<p class="muted">涓嬩竴闃舵锛?{nextRank}绾?路 璐圭敤 ${cost} 閲?/p>`
              : `<p class="muted">宸茶揪鍒版渶楂?S 绾с€?/p>`
          }
          <div class="button-row">
            ${renderFacilityAction(id, level, cost, disabled)}
          </div>
        </article>
      `;
    })
    .join("");

  container.querySelectorAll("[data-open-facility]").forEach((card) => {
    card.addEventListener("click", () => openFacilityDialog(card.dataset.openFacility));
  });
  container.querySelectorAll("[data-upgrade]").forEach((button) => {
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      handleFacilityUpgradeSpend(button);
    });
  });
  container.querySelectorAll("[data-buy-black-market-item]").forEach((button) => {
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      handleBlackMarketSpend(button);
    });
  });
  container.querySelectorAll("[data-hospital-treat]").forEach((button) => {
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      handleHospitalSpend(button);
    });
  });
}

function renderFacilityAction(id, level, cost, disabled) {
  const state = getState();
  if (id === "defenses") return `<button class="primary-button" data-upgrade="${id}" ${disabled}>淇缓闃插尽璁炬柦 路 ${cost} 閲?/button>`;
  if (level <= 0) return `<button class="primary-button" data-upgrade="${id}" ${disabled}>瑙ｉ攣 F绾?路 ${cost} 閲?/button>`;
  const upgradeButton = renderFacilityUpgradeButton(id, level, cost, disabled);
  if (id === "blackMarket") {
    const rank = getFacilityRankLabel(level);
    const actions = [
      ["supplies", "璐拱琛ョ粰/鏉傜墿"],
      ["weapon", "璐拱姝﹀櫒"],
      ["armor", "璐拱闃插叿"],
      ["mecha", "璐拱鏈虹敳"],
    ];
    return actions
      .map(([kind, label]) => {
        const itemCost = getBlackMarketItemCost(kind, rank);
        const isDisabled = state.gameStatus !== "active" ? "disabled" : "";
        return `<button class="${kind === "mecha" ? "primary-button" : "ghost-button"}" data-buy-black-market-item="${kind}" ${isDisabled}>${label} 路 ${rank}绾?${itemCost} 閲?/button>`;
      })
      .join("") + upgradeButton;
  }
  if (id === "hospital") {
    const plan = calculateHospitalTreatmentPlan(state);
    return `<button class="primary-button" data-hospital-treat ${state.gameStatus !== "active" || plan.entries.length === 0 ? "disabled" : ""}>娌荤枟璐熼潰鐘舵€?${plan.cost} 閲?/button>${upgradeButton}`;
  }
  return upgradeButton;
}

function renderFacilityUpgradeButton(id, level, cost, disabled) {
  if (id === "defenses") return `<button class="ghost-button" data-upgrade="${id}" ${disabled}>缁х画淇缓 路 ${cost} 閲?/button>`;
  if (level >= 7) return `<button class="ghost-button" disabled>鏈€楂?S绾?/button>`;
  return `<button class="ghost-button" data-upgrade="${id}" ${disabled}>鍗囩骇鍒?${getFacilityRankLabel(level + 1)}绾?路 ${cost} 閲?/button>`;
}

function openFacilityDialog(id) {
  const state = getState();
  const building = buildings[id];
  if (!building) return;

  const level = state.buildings[id] ?? 0;
  const isUnlocked = level > 0;
  const rank = getFacilityRankLabel(level);
  const nextCost = getFacilityUpgradeCost(id, level);
  const isStackedDefense = id === "defenses";
  const canUpgrade = (isStackedDefense || level < 7) && canUpgradeFacility(id);
  const nextRank = getFacilityRankLabel(Math.min(level + 1, 7));
  const specialText = {
    blackMarket: `鍙兘涔板埌褰撳墠榛戝競璇勭骇鐨勫晢鍝併€傚綋鍓嶅彲璐拱 ${rank}绾цˉ缁欍€佹鍣ㄣ€侀槻鍏蜂笌鏈虹敳銆俙,
    hospital: (() => {
      const plan = calculateHospitalTreatmentPlan(state);
      return `鎸夊彲娌荤枟鐨勮礋闈㈢姸鎬佹暟閲忔敹璐广€傚綋鍓嶅彲澶勭悊 ${plan.entries.length} 涓礋闈㈢姸鎬侊紝鎬昏垂鐢?${plan.cost} 閲戯紝鎴愬姛鐜?${plan.successChance}%锛屾渶楂樺彲娌荤枟${formatSeverityLabel(plan.allowedSeverity)}鐘舵€併€俙;
    })(),
    defenses: `鍩哄湴閬亣绐佽鏃舵彁渚涢澶栨垬鏂楀姏銆傚綋鍓嶅凡寤?${level} 搴э紝闃插尽鎴樻枟鍔?+${(state.buildings.defenses ?? 0) * economyConfig.facilities.defensePowerPerLevel}銆俙,
    tavern: "鎻愰珮鎷涘嫙姹犺妯★紝渚夸簬瀵绘壘鏇村鍊欓€変剑鍏点€?,
    barracks: `鎻愰珮鍙泧浣ｄ剑鍏典笂闄愩€傚綋鍓嶄笂闄?${
      economyConfig.facilities.baseMercenaryLimit +
      (state.buildings.barracks ?? 0) * economyConfig.facilities.barracksMercenaryLimitPerLevel
    } 浜猴紝姣忓崌 1 绾?+${economyConfig.facilities.barracksMercenaryLimitPerLevel}銆俙,
    infirmary: "姣忔棩鎺ㄨ繘鏃惰嚜鍔ㄩ檷浣庝剑鍏靛帇鍔涳紝浣嗘柟寮忎笉浣撻潰锛屼篃涓嶅共鍑€銆?,
    intel: `姣忕骇闄嶄綆璋冩煡濂戠害鎯呮姤璐圭敤 ${Math.round(economyConfig.facilities.intelInvestigationDiscountPerLevel * 100)}%锛屾€绘姌鎵ｄ粛鍙楄皟鏌ユ姌鎵ｄ笂闄愰檺鍒躲€俙,
  }[id] ?? "鍩虹璁炬柦鏁堟灉寰呮墿灞曘€?;

  document.querySelector("#facility-dossier").innerHTML = `
    <div class="dossier-top">
      <div>
        <div class="dossier-code">BASE FACILITY / ${id.toUpperCase()}</div>
        <h2 class="dossier-title">${building.name}</h2>
        <p class="muted">${
          isStackedDefense
            ? `${level} 搴?路 闃插尽鎴樺姏 +${level * economyConfig.facilities.defensePowerPerLevel}`
            : `${isUnlocked ? `${rank}绾 : "鏈В閿?} 路 缁存姢璐?${building.upkeep * level}/澶ー
        }</p>
      </div>
      <button class="ghost-button dialog-close-button" data-close-facility aria-label="鍏抽棴" title="鍏抽棴" type="button">鍏抽棴</button>
    </div>
    <div class="dossier-grid">
      <section class="dossier-section">
        <h3>鐘舵€?/h3>
        <div class="field-list">
          ${
            isStackedDefense
              ? `
                <div class="field"><span>宸插缓鏁伴噺</span><strong>${level} 搴?/strong></div>
                <div class="field"><span>闃插尽鎴樺姏</span><strong>+${level * economyConfig.facilities.defensePowerPerLevel}</strong></div>
                <div class="field"><span>缁存姢璐?/span><strong>${building.upkeep * level} 閲?澶?/strong></div>
                <div class="field"><span>缁х画淇缓</span><strong>${nextCost} 閲?/strong></div>
                <div class="field"><span>鍗曞骇鍔犳垚</span><strong>+${economyConfig.facilities.defensePowerPerLevel}</strong></div>
              `
              : `
                <div class="field"><span>褰撳墠鐘舵€?/span><strong>${isUnlocked ? "宸茶В閿? : "鏈В閿?}</strong></div>
                <div class="field"><span>璇勭骇</span><strong>${rank}</strong></div>
                <div class="field"><span>缁存姢璐?/span><strong>${building.upkeep * level} 閲?澶?/strong></div>
                <div class="field"><span>${isUnlocked ? "鍗囩骇璐圭敤" : "瑙ｉ攣璐圭敤"}</span><strong>${level >= 7 ? "宸叉弧绾? : `${nextCost} 閲慲}</strong></div>
                <div class="field"><span>涓嬩竴璇勭骇</span><strong>${level >= 7 ? "S绾? : `${nextRank}绾}</strong></div>
                <div class="field"><span>鍗囩骇鏉′欢</span><strong>${level >= 7 ? "宸插畬鎴? : "鏀粯璐圭敤"}</strong></div>
              `
          }
        </div>
      </section>
      <section class="dossier-section">
        <h3>鐢ㄩ€?/h3>
        <p class="muted">${building.description}</p>
        <p class="muted">${specialText}</p>
      </section>
      <section class="dossier-section wide">
        <h3>鍙敤鎿嶄綔</h3>
        <div class="button-row">
          ${renderFacilityAction(id, level, nextCost, state.gameStatus !== "active" || !canUpgrade)}
        </div>
      </section>
    </div>
  `;

  const dialog = document.querySelector("#facility-dialog");
  dialog.showModal();
  dialog.querySelector("[data-close-facility]").addEventListener("click", () => dialog.close());
  dialog.querySelectorAll("[data-upgrade]").forEach((button) => {
    button.addEventListener("click", () => {
      if (handleFacilityUpgradeSpend(button)) dialog.close();
    });
  });
  dialog.querySelectorAll("[data-buy-black-market-item]").forEach((button) => {
    button.addEventListener("click", () => {
      if (handleBlackMarketSpend(button)) dialog.close();
    });
  });
  dialog.querySelectorAll("[data-hospital-treat]").forEach((button) => {
    button.addEventListener("click", () => {
      if (handleHospitalSpend(button)) dialog.close();
    });
  });
}

function confirmGoldSpend(action, cost) {
  const state = getState();
  if (state.gold < cost) {
    showInsufficientFunds(state.gold, cost);
    return false;
  }
  return confirmResourceSpend(action, cost);
}

function getGoldFailureReason(currentGold, cost) {
  if (currentGold < cost) return `褰撳墠 ${currentGold} 閲戯紝杩樺樊 ${cost - currentGold} 閲戙€俙;
  return "鏉′欢涓嶆弧瓒虫垨鎿嶄綔鏈畬鎴愩€?;
}

function handleFacilityUpgradeSpend(button) {
  const id = button.dataset.upgrade;
  const building = buildings[id];
  const action = id === "defenses" ? "淇缓闃插尽璁炬柦" : `${building?.name ?? "璁炬柦"}鍗囩骇`;
  const cost = getCostFromText(button.textContent);
  if (!confirmGoldSpend(action, cost)) return false;
  const beforeGold = getState().gold;
  const beforeLevel = getState().buildings[id] ?? 0;
  upgradeBuilding(id);
  const after = getState();
  const afterLevel = after.buildings[id] ?? 0;
  if (afterLevel <= beforeLevel || after.gold >= beforeGold) {
    showSpendFailure(action, getGoldFailureReason(beforeGold, cost));
    return false;
  }
  showSpendSuccess(action, beforeGold - after.gold, after.gold);
  return true;
}

function handleBlackMarketSpend(button) {
  const kind = button.dataset.buyBlackMarketItem;
  const labels = { supplies: "榛戝競閲囪喘琛ョ粰", weapon: "榛戝競璐拱姝﹀櫒", armor: "榛戝競璐拱闃插叿", mecha: "榛戝競璐拱鏈虹敳" };
  const action = labels[kind] ?? "榛戝競閲囪喘";
  const cost = getCostFromText(button.textContent);
  if (!confirmGoldSpend(action, cost)) return false;
  const before = getState();
  const beforeCount = kind === "mecha" ? before.mechs.length : before.inventory.length;
  const beforeGold = before.gold;
  buyBlackMarketItem(kind);
  const after = getState();
  const afterCount = kind === "mecha" ? after.mechs.length : after.inventory.length;
  if (afterCount <= beforeCount || after.gold >= beforeGold) {
    showSpendFailure(action, getGoldFailureReason(beforeGold, cost));
    return false;
  }
  showSpendSuccess(action, beforeGold - after.gold, after.gold);
  return true;
}

function handleHospitalSpend(button) {
  const action = "Medical treatment";
  const cost = getCostFromText(button.textContent);
  if (!confirmGoldSpend(action, cost)) return false;
  const before = getState();
  const beforeConditions = before.roster.reduce((sum, character) => sum + (character.conditions?.length ?? 0), 0);
  const beforeGold = before.gold;
  hospitalTreatMercenaries();
  const after = getState();
  const afterConditions = after.roster.reduce((sum, character) => sum + (character.conditions?.length ?? 0), 0);
  if (after.gold >= beforeGold) {
    showSpendFailure(action, getGoldFailureReason(beforeGold, cost));
    return false;
  }
  const curedText = beforeConditions > afterConditions ? `, cured ${beforeConditions - afterConditions} negative status` : ", no condition was cured this time";
  showToast(`${action} complete, spent ${beforeGold - after.gold} gold${curedText}, remaining ${after.gold} gold.`, beforeConditions > afterConditions ? "good" : "warning");
  return true;
}

function getCostFromText(text = "") {
  const match = String(text).match(/(\d+)/);
  return match ? Number(match[1]) : 0;
}

init();


})();
